name: System Layer Audit

on:
  push:
    paths:
      - "data/history/_BACKFILL_COMPLETE"
      - "data/fundamentals/_FUNDAMENTALS_COMPLETE"
      - "data/candidates.json"
      - "data/backtest/short_term_latest.json"
      - "data/backtest/short_term_sensitivity.json"
      - "data/backtest/short_term_exit_diagnostics.json"
      - ".github/workflows/system-audit.yml"
      - "scripts/system_audit.py"
      - "scripts/validate_candidates.py"
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run cross-layer audit
        run: python scripts/system_audit.py
      - name: Commit audit result
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aquant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/system_audit.json
          if git diff --cached --quiet; then
            echo "No system audit changes"
            exit 0
          fi
          git commit -m "audit: refresh system layer readiness"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
