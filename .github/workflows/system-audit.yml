name: 系统审计

on:
  push:
    paths:
      - "data/history/_BACKFILL_COMPLETE"
      - "data/fundamentals/_FUNDAMENTALS_COMPLETE"
      - "data/candidates.json"
      - "data/backtest/short_term_latest.json"
      - "data/backtest/short_term_sensitivity.json"
      - "data/backtest/short_term_exit_diagnostics.json"
      - "data/backtest/short_term_release_validation.json"
      - "scripts/system_audit.py"
  workflow_dispatch:
  schedule:
    - cron: "30 12 * * 1-5"

permissions:
  contents: write

concurrency:
  group: system-audit-main
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 运行跨层审计
        run: python scripts/system_audit.py
      - name: 提交审计结果
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aquant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/system_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "audit: refresh system layer readiness"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
