name: 短线策略研究

on:
  push:
    branches: [main]
    paths:
      - "scripts/short_term_research.py"
      - "scripts/update_candidates.py"
      - "scripts/train_path_aware_model.py"
      - "scripts/path_rule_mining.py"
      - "tests/test_short_term_research.py"
      - "scripts/short_term_release_validation.py"
      - "requirements.txt"
  schedule:
    - cron: "0 13 * * 0"
  workflow_dispatch:
    inputs:
      resume_run_id:
        description: "要恢复的历史运行编号；留空表示从头开始"
        required: false
        default: ""
        type: string

permissions:
  contents: write
  actions: read

concurrency:
  group: short-term-research-main
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - name: Lock public source revision
        run: echo "PUBLIC_SOURCE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Checkout private strategy
        uses: actions/checkout@v6
        with:
          repository: 13415837267/Aquant-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy
          fetch-depth: 1
      - name: Initialize runtime progress
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          printf '%s\n' "{\"timestamp_utc\":\"$(date -u +%FT%TZ)\",\"event\":\"workflow_started\",\"run_id\":\"${GITHUB_RUN_ID}\",\"resume_run_id\":\"${{ inputs.resume_run_id }}\"}" > runtime/workflow_progress.jsonl
      - name: Restore checkpoint from previous run
        if: ${{ inputs.resume_run_id != '' }}
        uses: actions/download-artifact@v5
        with:
          name: short-term-research-checkpoint
          path: runtime
          run-id: ${{ inputs.resume_run_id }}
          github-token: ${{ github.token }}
      - name: Record resume or fresh start
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.resume_run_id }}" ]]; then
            echo "{\"timestamp_utc\":\"$(date -u +%FT%TZ)\",\"event\":\"workflow_resume_requested\",\"source_run_id\":\"${{ inputs.resume_run_id }}\"}" >> runtime/workflow_progress.jsonl
          else
            echo "{\"timestamp_utc\":\"$(date -u +%FT%TZ)\",\"event\":\"workflow_fresh_start\"}" >> runtime/workflow_progress.jsonl
          fi
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Resolve strategy
        id: strategy
        shell: bash
        run: |
          echo "version=$(python -c 'import sys; sys.path.insert(0, ".private-strategy"); from strategy.version import STRATEGY_VERSION; print(STRATEGY_VERSION)')" >> "$GITHUB_OUTPUT"
          echo "commit=$(git -C .private-strategy rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Python quality
        run: python -m pytest -q
      - name: Private strategy quality
        working-directory: .private-strategy
        run: python -m pytest -q
      - name: Preserve current production candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          cp data/candidates.json runtime/production_candidates.json
      - name: Generate research candidates
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
        run: python scripts/update_candidates.py
      - name: Validate candidates
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
        run: python scripts/validate_candidates.py
      - name: Run short-term research
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: ${{ steps.strategy.outputs.commit }}
        run: |
          set -Eeuo pipefail
          echo "{\"timestamp_utc\":\"$(date -u +%FT%TZ)\",\"event\":\"stage_started\",\"stage\":\"short_term_research\"}" >> runtime/workflow_progress.jsonl
          python scripts/short_term_research.py --start 2018-01-05 --end 2026-09-30 --cost-bps 3 --slippage-bps 2 --checkpoint runtime/research_checkpoint.json.gz --progress-log runtime/progress.jsonl
          echo "{\"timestamp_utc\":\"$(date -u +%FT%TZ)\",\"event\":\"stage_completed\",\"stage\":\"short_term_research\"}" >> runtime/workflow_progress.jsonl
      - name: Persist checkpoint and progress
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: short-term-research-checkpoint
          path: |
            runtime/research_checkpoint.json.gz
            runtime/progress.jsonl
            runtime/workflow_progress.jsonl
          retention-days: 30
      - name: Release holdout validation
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: ${{ steps.strategy.outputs.commit }}
        run: python scripts/short_term_release_validation.py --development-start 2018-01-05 --development-end 2024-12-20 --validation-start 2025-01-02 --validation-end 2025-12-31 --final-start 2026-01-05 --final-end 2026-09-21
      - name: Record research candidate without declaring production
        shell: bash
        run: |
          set -euo pipefail
          cp data/candidates.json data/backtest/research_candidates.json
          python - <<'PY'
          import json
          from pathlib import Path
          release=json.loads(Path("data/backtest/short_term_release_validation.json").read_text(encoding="utf-8"))
          candidates=json.loads(Path("data/candidates.json").read_text(encoding="utf-8"))
          passed=release.get("release_gate") is True
          status={
              "schema_version": 1,
              "status": "release_candidate" if passed else "not_released",
              "production_version": candidates.get("strategy_version") if passed else None,
              "production_strategy_commit": candidates.get("strategy_commit") if passed else None,
              "as_of": candidates.get("as_of") if passed else None,
              "release_gate": passed,
              "system_audit": False,
              "note": "通过发布门槛后仍需系统审计；系统审计通过前不得视为正式生产产物。" if passed else "当前没有正式生产策略；研究候选不得视为正式生产产物。"
          }
          Path("data/production_status.json").write_text(json.dumps(status,ensure_ascii=False,indent=2)+"\\n",encoding="utf-8")
          PY
      - name: Run system audit
        run: python scripts/system_audit.py
      - name: Record workflow failure or cancellation
        if: ${{ failure() || cancelled() }}
        shell: bash
        run: |
          mkdir -p runtime
          echo "{\"timestamp_utc\":\"$(date -u +%FT%TZ)\",\"event\":\"workflow_interrupted\",\"status\":\"${{ job.status }}\"}" >> runtime/workflow_progress.jsonl
      - name: Commit research outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git -C .private-strategy fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$PUBLIC_SOURCE_SHA" ]]; then
            echo "Public source revision changed during research; refusing stale result commit."
            exit 1
          fi
          if [[ "$(git -C .private-strategy rev-parse origin/main)" != "${{ steps.strategy.outputs.commit }}" ]]; then
            echo "Private/main strategy changed during research; refusing stale result commit."
            exit 1
          fi
          git add data/candidates.json data/backtest/research_candidates.json data/backtest/short_term_latest.json data/backtest/short_term_sensitivity.json data/backtest/short_term_exit_diagnostics.json data/backtest/short_term_release_validation.json data/system_audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: validate short-term strategy"
          git push origin HEAD:main

# Cloud research must follow the current Private/main strategy implementation.
# Precision research candidate follows the latest Aquant-Private/main checkout.
