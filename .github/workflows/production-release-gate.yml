name: 正式发布门禁

on:
  workflow_dispatch:
    inputs:
      approve_release:
        description: "明确授权本次研究版本进入正式生产；仅在最终留出、系统审计和策略来源一致性全部通过后选择是"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: production-release-gate
  cancel-in-progress: false

jobs:
  release:
    name: 正式生产发布门禁
    if: ${{ inputs.approve_release == true }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment:
      name: production
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 先执行系统审计并要求发布条件通过
        run: python scripts/system_audit.py --allow-release
      - name: 验证生产状态
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          status = json.loads(Path("data/production_status.json").read_text(encoding="utf-8"))
          if status.get("status") != "released":
              raise SystemExit("正式发布失败：系统审计或发布门禁未通过")
          if status.get("release_gate") is not True or status.get("system_audit") is not True:
              raise SystemExit("正式发布失败：发布门禁或系统审计标记不完整")
          print("正式生产发布条件通过")
          PY
      - name: 固化正式生产状态
        run: |
          set -euo pipefail
          git config user.name "aquant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/production_status.json data/system_audit.json data/next_trading_day_plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "release: 通过正式生产发布门禁"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
