name: "07 可执行净收益研究"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

# 只运行一个明确假设的研究分支；普通提交不触发整套历史条件挖掘。
on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/07-executable-return-research.yml"
      - "scripts/train_executable_return_ranker.py"
      - "scripts/executable_return_backtest.py"
      - "tests/test_executable_return_ranker.py"
      - "tests/test_candidate_count_operating_point_research.py"
      - "scripts/compound_portfolio_backtest.py"
      - "scripts/high_precision_profit_mining.py"
      - "scripts/train_short_term_model.py"
      - "scripts/short_term_research.py"
      - "scripts/market_scope.py"
      - "scripts/selection_factor_catalog.py"
      - "config/选股条件研究配置.json"

permissions:
  contents: read
  actions: read

concurrency:
  group: "可执行净收益研究-main"
  cancel-in-progress: false

jobs:
  executable-return-research:
    name: "净收益目标训练与交易验证"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置Python环境"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装免费开源研究依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "云端质量门禁"
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m pytest -q

      - name: "计算训练历史行情指纹"
        id: high_precision_history
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import os
          from scripts.short_term_research import history_files
          from scripts.train_short_term_model import FINAL_END

          files = [path for path in history_files() if path.name[:10] <= FINAL_END]
          if not files:
              raise SystemExit("训练历史行情指纹计算失败：没有找到训练区间内的数据文件。")
          digest = hashlib.sha256()
          for path in files:
              digest.update(path.name.encode("utf-8"))
              digest.update(b"\0")
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
          fingerprint = digest.hexdigest()
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"sha256={fingerprint}\n")
          print(f"训练历史行情指纹已计算：文件数={len(files)}，日期范围={files[0].name[:10]}至{files[-1].name[:10]}，SHA256={fingerprint}")
          PY

      - name: "恢复同历史数据、代码和配置的高精度基准缓存"
        id: high_precision_cache
        uses: actions/cache/restore@v5
        with:
          path: data/backtest/high_precision_profit_mining_research_latest.json
          key: aquant-high-precision-baseline-v1-${{ runner.os }}-${{ steps.high_precision_history.outputs.sha256 }}-${{ hashFiles('scripts/high_precision_profit_mining.py', 'scripts/train_short_term_model.py', 'scripts/short_term_research.py', 'scripts/selection_factor_catalog.py', 'scripts/market_scope.py', 'config/选股条件研究配置.json', 'requirements.txt') }}

      - name: "校验高精度基准；缓存缺失或不兼容时按当前代码重新训练"
        run: |
          set -euo pipefail
          mkdir -p data/backtest
          if python - <<'PY'
          import json
          from pathlib import Path
          from scripts.train_short_term_model import FEATURES

          path = Path("data/backtest/high_precision_profit_mining_research_latest.json")
          if not path.is_file():
              print("当前指纹缓存不存在。")
              raise SystemExit(1)
          try:
              result = json.loads(path.read_text(encoding="utf-8"))
          except (OSError, json.JSONDecodeError):
              print("当前指纹缓存不是有效JSON。")
              raise SystemExit(1)

          expected_splits = {
              "train": ["2015-01-05", "2022-12-30"],
              "validation": ["2023-01-03", "2024-12-31"],
              "final": ["2025-01-02", "2026-09-30"],
          }
          reasons = []
          if result.get("status") != "research_only":
              reasons.append("状态不是research_only")
          if result.get("audit", {}).get("formal_production_changed") is not False:
              reasons.append("缺少正式模型隔离审计")
          if result.get("model", {}).get("features") != FEATURES:
              reasons.append(f"特征不匹配：当前{len(FEATURES)}个，工件{len(result.get('model', {}).get('features', []))}个")
          for name, dates in expected_splits.items():
              if result.get("splits", {}).get(name) != dates:
                  reasons.append(f"{name}时间切分不匹配")
          if reasons:
              print("高精度基准缓存不兼容：" + "；".join(reasons))
              raise SystemExit(1)
          print(f"高精度基准缓存兼容：特征数={len(FEATURES)}，训练/验证/最终区间与当前代码一致。")
          PY
          then
            echo "复用经当前历史行情、代码、依赖和配置指纹锁定的高精度基准。"
          else
            echo "基准缓存缺失或不兼容；按当前研究代码与完整历史训练窗重新训练，不使用旧特征工件。"
            rm -f data/backtest/high_precision_profit_mining_research_latest.json
            python scripts/high_precision_profit_mining.py \
              --start 2015-01-05 \
              --final-end 2026-09-30 \
              --output data/backtest/high_precision_profit_mining_research_latest.json
          fi

          python - <<'PY'
          import json
          from pathlib import Path
          from scripts.train_short_term_model import FEATURES

          path = Path("data/backtest/high_precision_profit_mining_research_latest.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          assert result.get("status") == "research_only", "高精度基准状态不是研究专用"
          assert result.get("audit", {}).get("formal_production_changed") is False, "研究结果未与正式模型隔离"
          assert result.get("model", {}).get("features") == FEATURES, "最终基准特征与当前训练代码不一致"
          assert result.get("splits", {}).get("train") == ["2015-01-05", "2022-12-30"], "训练区间不匹配"
          assert result.get("splits", {}).get("validation") == ["2023-01-03", "2024-12-31"], "验证区间不匹配"
          assert result.get("splits", {}).get("final") == ["2025-01-02", "2026-09-30"], "最终补充区间不匹配"
          print("高精度基准最终验收通过；特征、时间切分和正式模型隔离均一致。")
          PY

      - name: "保存通过兼容性验收的高精度基准缓存"
        if: ${{ success() && steps.high_precision_cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@v5
        with:
          path: data/backtest/high_precision_profit_mining_research_latest.json
          key: aquant-high-precision-baseline-v1-${{ runner.os }}-${{ steps.high_precision_history.outputs.sha256 }}-${{ hashFiles('scripts/high_precision_profit_mining.py', 'scripts/train_short_term_model.py', 'scripts/short_term_research.py', 'scripts/selection_factor_catalog.py', 'scripts/market_scope.py', 'config/选股条件研究配置.json', 'requirements.txt') }}

      - name: "恢复兼容的净收益训练断点"
        uses: actions/cache/restore@v5
        with:
          path: data/research/checkpoints/executable_return_ranker.pkl
          key: aquant-executable-return-v2-${{ runner.os }}-${{ hashFiles('scripts/train_executable_return_ranker.py', 'scripts/high_precision_profit_mining.py', 'scripts/train_short_term_model.py', 'scripts/short_term_research.py', 'scripts/market_scope.py', 'scripts/selection_factor_catalog.py', 'scripts/compound_portfolio_backtest.py', 'config/选股条件研究配置.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aquant-executable-return-v2-${{ runner.os }}-${{ hashFiles('scripts/train_executable_return_ranker.py', 'scripts/high_precision_profit_mining.py', 'scripts/train_short_term_model.py', 'scripts/short_term_research.py', 'scripts/market_scope.py', 'scripts/selection_factor_catalog.py', 'scripts/compound_portfolio_backtest.py', 'config/选股条件研究配置.json') }}-

      - name: "训练实际可执行净收益模型（支持断点恢复）"
        id: train_return
        run: |
          set -euo pipefail
          python scripts/train_executable_return_ranker.py \
            --model-result data/backtest/high_precision_profit_mining_research_latest.json \
            --output data/backtest/executable_return_ranker_research_latest.json \
            --checkpoint-path data/research/checkpoints/executable_return_ranker.pkl \
            --checkpoint-every-days 100

      - name: "持久化训练断点"
        if: ${{ always() }}
        uses: actions/cache/save@v5
        with:
          path: data/research/checkpoints/executable_return_ranker.pkl
          key: aquant-executable-return-v2-${{ runner.os }}-${{ hashFiles('scripts/train_executable_return_ranker.py', 'scripts/high_precision_profit_mining.py', 'scripts/train_short_term_model.py', 'scripts/short_term_research.py', 'scripts/market_scope.py', 'scripts/selection_factor_catalog.py', 'scripts/compound_portfolio_backtest.py', 'config/选股条件研究配置.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "按验证期选择并评估真实交易策略"
        id: backtest_return
        if: ${{ steps.train_return.outcome == 'success' }}
        run: |
          set -euo pipefail
          python scripts/executable_return_backtest.py \
            --model-result data/backtest/high_precision_profit_mining_research_latest.json \
            --ranker-result data/backtest/executable_return_ranker_research_latest.json \
            --output data/backtest/executable_return_backtest_latest.json

      - name: "输出可复核的验收摘要"
        if: ${{ steps.backtest_return.outcome == 'success' }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/backtest/executable_return_backtest_latest.json")
          result = json.loads(path.read_text(encoding="utf-8"))
          validation = result["validation"]["selected_policy"]
          final = result["final_holdout"]
          print("===== 直接净收益回归验收 =====")
          print(json.dumps({
              "status": result["status"],
              "training_method": "真实可执行交易净收益回归",
              "validation_selected_policy": validation["policy"],
              "validation_gate_passed": validation["validation_gate"]["passed"],
              "validation_metrics": validation["validation_selection_metrics"],
              "final_holdout_policy": final["validation_selected_policy_name"],
              "final_holdout_gate": final["validation_selected_policy_gate"],
              "final_holdout_metrics": final["validation_selected_regression_policy"],
              "compound_return_delta_vs_baseline_pct": final["compound_return_delta_vs_classifier_baseline_pct"],
              "promotion_allowed": result["acceptance"]["promotion_allowed"],
              "rejection_reason": result["acceptance"]["reason"],
              "formal_production_changed": result["audit"]["formal_production_changed"],
          }, ensure_ascii=False, indent=2))
          PY

      - name: "保存研究工件"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: "可执行净收益回归研究结果"
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/executable_return_ranker_research_latest.json
            data/backtest/executable_return_backtest_latest.json
          if-no-files-found: warn
          retention-days: 30
