name: Daily Data Health Check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-health-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/checkout@v5
        name: Checkout latest private strategy
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data pipeline
        run: pip install -r requirements.txt
      - name: Validate latest full-field market data
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/backfill_history.py --mode validate --days 3
      - name: Build candidates from latest Private strategy
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: ${{ github.event.repository.default_branch }}
        run: |
          export AQUANT_PRIVATE_STRATEGY_COMMIT="$(git -C .private-strategy rev-parse HEAD)"
          python scripts/update_candidates.py
      - name: Commit candidate snapshot
        run: |
          git config user.name "13415837267"
          git config user.email "13415837267@users.noreply.github.com"
          if git diff --quiet -- data/candidates.json; then
            echo "Candidate snapshot unchanged."
            exit 0
          fi
          git add data/candidates.json
          git commit -m "data: refresh database-driven candidates"
          git push
