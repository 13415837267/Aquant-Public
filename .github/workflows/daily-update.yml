name: Daily Data Health Check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-health-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data pipeline
        run: pip install -r requirements.txt
      - name: Validate latest full-field market data
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/backfill_history.py --mode validate --days 3
