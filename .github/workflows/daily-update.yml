name: Daily Data Health Check

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-data-health-check
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install data pipeline
        run: pip install -r requirements.txt
      - name: Validate latest full-field market data
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/backfill_history.py --mode validate --days 3
      - name: Build database-driven candidates
        run: python scripts/update_candidates.py
      - name: Commit candidate snapshot
        run: |
          git config user.name "13415837267"
          git config user.email "13415837267@users.noreply.github.com"
          if git diff --quiet -- data/candidates.json; then
            echo "Candidate snapshot unchanged."
            exit 0
          fi
          git add data/candidates.json
          git commit -m "data: refresh database-driven candidates"
          git push
