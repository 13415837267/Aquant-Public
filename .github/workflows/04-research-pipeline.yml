name: "04 历史研究流水线"

on:
  push:
    paths:
      - ".github/workflows/04-research-pipeline.yml"
      - "config/research_run_contract.json"
      - "scripts/train_short_term_model.py"
      - "scripts/high_precision_profit_mining.py"
  workflow_dispatch:
  workflow_run:
    workflows: ["03 候选池生产"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: "历史研究-main"
  cancel-in-progress: false

jobs:
  research:
    name: "固定研究基线并完成三段式验证"
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装Python依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "读取研究契约"
        id: contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("config/research_run_contract.json")
          c = json.loads(p.read_text(encoding="utf-8"))
          assert c["status"] == "locked_for_research"
          assert c["public_code_commit"] == "13c93ae0cf3c34075729411e7c91e84f616d859a"
          assert c["private_commit"] == "f2b906ede1ab2ddbec7f581e1c99d5d7caca39dd"
          assert c["data_cutoff"] == "2026-09-30"
          assert c["execution"]["signal"] == "T_close"
          assert c["execution"]["entry"] == "T+1_open"
          assert c["execution"]["earliest_exit"] == "T+2"
          assert c["execution"]["max_holding_sessions"] == 5
          assert c["execution"]["target_net_profit_pct"] == 1
          assert c["execution"]["stop_loss_pct"] == 3
          assert c["execution"]["entry_limit_up_block"] is True
          assert c["gates"]["validation_threshold_win_rate_pct"] >= 80
          assert c["gates"]["final_holdout_threshold_win_rate_pct"] >= 80
          assert c["gates"]["minimum_managed_trade_samples"] >= 100
          assert c["gates"]["future_function"] is False
          assert c["checkpoint_resume"] is True
          assert c["progress_logging"]["enabled"] is True
          assert c["progress_logging"]["checkpoint_days"] == 5
          assert c["progress_logging"]["persist_by_research_day"] is True
          print("研究契约校验通过。")
          PY

      - name: "执行云端短线模型训练"
        run: |
          python scripts/high_precision_profit_mining.py \
            --start 2015-01-05 \
            --final-end 2026-09-30 \
            --output data/backtest/high_precision_profit_mining_retrained.json

      - name: "保存研究模型实验产物"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: "严格标签生产兼容模型研究"
          path: data/backtest/high_precision_profit_mining_retrained.json
          if-no-files-found: warn
          retention-days: 30
      - name: "检出固定Private策略"
        uses: actions/checkout@v7
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          path: private-strategy
          token: ${{ secrets.AQUANT_PRIVATE_TOKEN }}
          fetch-depth: 1

      - name: "验证Private策略提交"
        env:
          EXPECTED_PRIVATE_COMMIT: "f2b906ede1ab2ddbec7f581e1c99d5d7caca39dd"
        run: |
          ACTUAL_PRIVATE_COMMIT="$(git -C private-strategy rev-parse HEAD)"
          echo "Private策略提交: $ACTUAL_PRIVATE_COMMIT"
          test "$ACTUAL_PRIVATE_COMMIT" = "$EXPECTED_PRIVATE_COMMIT"

      - name: "建立固定公开代码研究基线"
        env:
          PUBLIC_CODE_COMMIT: "13c93ae0cf3c34075729411e7c91e84f616d859a"
        run: |
          git fetch --no-tags origin "$PUBLIC_CODE_COMMIT" --depth=1
          git worktree add --detach research-baseline "$PUBLIC_CODE_COMMIT"
          test "$(git -C research-baseline rev-parse HEAD)" = "$PUBLIC_CODE_COMMIT"

      - name: "执行按交易日断点续传的开发验证最终留出研究"
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: "f2b906ede1ab2ddbec7f581e1c99d5d7caca39dd"
          AQUANT_CHECKPOINT_REPO_ROOT: ${{ github.workspace }}
        working-directory: research-baseline
        run: |
          python scripts/short_term_release_validation.py \
            --development-start 2018-01-05 \
            --development-end 2024-12-20 \
            --validation-start 2025-01-02 \
            --validation-end 2025-12-31 \
            --final-start 2026-01-05 \
            --final-end 2026-09-30 \
            --cost-bps 3 \
            --slippage-bps 2 \
            --output ../data/backtest/short_term_release_validation.json \
            --research-root ../data/research/short_term_release_validation
      - name: "诊断正式候选链与严格交易标签"
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: "f2b906ede1ab2ddbec7f581e1c99d5d7caca39dd"
        working-directory: research-baseline
        run: |
          python - <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          import numpy as np
          import pandas as pd

          sys.path.insert(0, str(Path.cwd()))
          from scripts.short_term_research import FeatureState, history_files, managed_trade, read_daily

          private_root = os.environ["AQUANT_PRIVATE_STRATEGY_PATH"]
          sys.path.insert(0, private_root)
          from strategy import model

          files = history_files()
          dates = [p.name[:10] for p in files]
          windows = {
              "development": ("2018-01-05", "2024-12-20"),
              "validation": ("2025-01-02", "2025-12-31"),
              "final_holdout": ("2026-01-05", "2026-09-30"),
          }
          index = {name: (dates.index(start), dates.index(end)) for name, (start, end) in windows.items()}
          begin = max(0, index["development"][0] - 20)
          end_i = index["final_holdout"][1]
          active = files[begin:end_i + 6]
          cache = {}

          def get(i):
              if i not in cache:
                  cache[i] = read_daily(active[i])
              return cache[i]

          state = FeatureState()
          summary = {
              name: {
                  "signal_days": 0, "candidate_days": 0, "candidates": 0,
                  "tiers": {}, "wins": 0, "positive": 0, "stops": 0,
                  "targets": 0, "max_hold": 0, "managed_samples": 0
              } for name in windows
          }

          for i in range(len(active) - 5):
              date = active[i].name[:10]
              period = next((name for name, (start, end) in windows.items() if start <= date <= end), None)
              frame = state.build(get(i))
              if period is None or frame.empty:
                  continue
              summary[period]["signal_days"] += 1
              scored = model.score_universe(frame)
              safe = model.admit_candidates(scored)
              if safe.empty:
                  continue
              summary[period]["candidate_days"] += 1
              summary[period]["candidates"] += len(safe)
              for tier, count in safe["admission_tier"].value_counts().items():
                  summary[period]["tiers"][str(tier)] = summary[period]["tiers"].get(str(tier), 0) + int(count)
              future = [get(i + j) for j in range(1, 6)]
              for symbol in safe["symbol"].astype(str).str.zfill(6):
                  trade = managed_trade(symbol, future, round_trip_cost_bps=10.0)
                  if trade is None:
                      continue
                  summary[period]["managed_samples"] += 1
                  gross = float(trade["gross_return_pct"])
                  net = gross - 0.10
                  summary[period]["wins"] += int(net >= 1.0)
                  summary[period]["positive"] += int(net > 0.0)
                  reason = trade.get("exit_reason")
                  summary[period][{"stop":"stops","target":"targets","max_hold":"max_hold"}.get(reason, "max_hold")] += 1

          out = {
              "schema_version": 1,
              "status": "research_only",
              "strategy_version": "2.5.0",
              "strategy_commit": os.environ["AQUANT_PRIVATE_STRATEGY_COMMIT"],
              "research_code_commit": "13c93ae0cf3c34075729411e7c91e84f616d859a",
              "objective": "定位正式候选准入层与严格交易标签之间的性能损失",
              "windows": summary,
              "audit": {
                  "future_function": False,
                  "entry": "T+1_open",
                  "earliest_exit": "T+2",
                  "max_holding_sessions": 5,
                  "target_net_profit_pct": 1.0,
                  "stop_loss_pct": 3.0,
                  "stop_first": True
              }
          }
          Path("../data/research/production_candidate_diagnostic.json").parent.mkdir(parents=True, exist_ok=True)
          Path("../data/research/production_candidate_diagnostic.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          print(json.dumps(out, ensure_ascii=False, indent=2))
          PY

      - name: "保存候选链诊断产物"
        uses: actions/upload-artifact@v6
        with:
          name: "正式候选链严格标签诊断"
          path: data/research/production_candidate_diagnostic.json
          if-no-files-found: error
          retention-days: 30

      - name: "执行研究契约最终门禁"
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path

          contract = json.loads(Path("config/research_run_contract.json").read_text(encoding="utf-8"))
          result = json.loads(Path("data/backtest/short_term_release_validation.json").read_text(encoding="utf-8"))

          assert result["strategy_source"] == "Aquant-Private/main"
          assert result["strategy_version"] == "2.5.0"
          assert result["strategy_commit"] == contract["private_commit"]
          assert result["future_function"] is False
          assert result["entry"] == "T+1_open"
          assert result["max_holding_sessions"] == 5
          assert result["win_definition"] == "net_profit_at_least_1pct_before_3pct_stop_within_5_sessions"

          validation = result["validation"]
          final = result["final_holdout"]
          min_samples = contract["gates"]["minimum_managed_trade_samples"]
          threshold = contract["gates"]["validation_threshold_win_rate_pct"]

          checks = {
            "validation_win_rate": validation["managed_trade"]["threshold_win_rate_pct"] is not None and validation["managed_trade"]["threshold_win_rate_pct"] >= threshold,
            "validation_samples": validation["managed_trade"]["samples"] >= min_samples,
            "final_win_rate": final["managed_trade"]["threshold_win_rate_pct"] is not None and final["managed_trade"]["threshold_win_rate_pct"] >= contract["gates"]["final_holdout_threshold_win_rate_pct"],
            "final_samples": final["managed_trade"]["samples"] >= min_samples,
            "future_function": result["future_function"] is False,
          }
          print(json.dumps({"门禁检查": checks, "验证集": validation["managed_trade"], "最终留出": final["managed_trade"]}, ensure_ascii=False, indent=2))
          gate_path = Path("data/research_gate.json")
          gate_path.write_text(json.dumps({"release_gate": all(checks.values()), "checks": checks}, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          if not all(checks.values()):
              print("研究未通过正式发布门禁；结果保留为未发布状态，流水线继续保存审计结果。")
          PY

      - name: "生成当前研究状态"
        run: |
          python - <<'PY'
          import json, math
          from pathlib import Path
          from datetime import datetime, timezone

          result = json.loads(Path("data/backtest/short_term_release_validation.json").read_text(encoding="utf-8"))
          contract = json.loads(Path("config/research_run_contract.json").read_text(encoding="utf-8"))
          gate = json.loads(Path("data/research_gate.json").read_text(encoding="utf-8"))

          def wilson_lower(samples, wins, z=1.959963984540054):
              if samples <= 0:
                  return None
              p = wins / samples
              den = 1 + z*z/samples
              center = p + z*z/(2*samples)
              margin = z * math.sqrt((p*(1-p) + z*z/(4*samples))/samples)
              return (center - margin) / den * 100

          payload = {
            "schema_version": 3,
            "status": "validated_for_audit" if gate["release_gate"] else "rejected_by_release_gate",
            "as_of": datetime.now(timezone.utc).isoformat(),
            "timezone": "Asia/Shanghai",
            "strategy_source": "Aquant-Private/main",
            "strategy_version": result["strategy_version"],
            "strategy_commit": result["strategy_commit"],
            "research_code_commit": contract["public_code_commit"],
            "data_cutoff": contract["data_cutoff"],
            "objective": "net_profit_at_least_1pct_before_3pct_stop_within_5_sessions",
            "future_function": False,
            "execution": contract["execution"],
            "costs": contract["costs"],
            "development": result["development"],
            "validation": result["validation"],
            "final_holdout": result["final_holdout"],
            "release_gate": gate["release_gate"],
            "release_gate_checks": gate["checks"],
            "release_gate_scope": "validation_and_final_holdout",
            "production_release": False,
            "production_version": None,
            "note": ("研究已通过正式门禁，等待系统审计；正式生产发布仍未开启。" if gate["release_gate"] else "研究未通过正式发布门禁；结果仅用于研究与审计，禁止写入ready生产状态。"),
          }
          # 研究结果没有独立wins字段时不反推Wilson下界，避免虚构胜场数。\n          Path("data/research_status.json").write_text(json.dumps(payload, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          Path("data/backtest/short_term_release_validation.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2) + "\n", encoding="utf-8"
          )
          PY
          
      - name: "提交研究结果"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research_status.json data/backtest/short_term_release_validation.json
          if git diff --cached --quiet; then
            echo "研究结果无变化，无需提交。"
          else
            git commit -m "完成三段式历史研究验证"
            git push
          fi
