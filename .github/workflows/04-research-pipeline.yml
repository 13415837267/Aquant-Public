name: "04 历史研究流水线"

on:
  push:
    paths:
      - ".github/workflows/04-research-pipeline.yml"
      - "config/research_run_contract.json"
      - "scripts/train_short_term_model.py"
      - "scripts/high_precision_profit_mining.py"
      - "scripts/train_path_aware_gbdt.py"
  workflow_dispatch:
  workflow_run:
    workflows: ["03 候选池生产"]
    types: [completed]

permissions:
  contents: write

concurrency:
  group: "历史研究-main"
  cancel-in-progress: true

jobs:
  research:
    name: "固定研究基线并完成三段式验证"
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
      - name: "安装Python依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: "执行云端短线模型训练"
        run: |
          python scripts/high_precision_profit_mining.py --start 2015-01-05 --final-end 2026-09-30 --output data/backtest/high_precision_profit_mining_retrained.json
      - name: "执行云端路径感知梯度提升训练"
        run: |
          python scripts/train_path_aware_gbdt.py --output data/backtest/path_aware_gbdt_research.json
      - name: "保存路径感知模型实验产物"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: "路径感知梯度提升模型研究"
          path: data/backtest/path_aware_gbdt_research.json
          if-no-files-found: warn
          retention-days: 30
