name: "10 上涨样本筛选与归因分析"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "scripts/uptrend_stock_attribution.py"
      - "tests/test_uptrend_stock_attribution.py"
      - "config/上涨样本分析配置.json"
      - ".github/workflows/10-uptrend-stock-attribution.yml"

permissions:
  contents: read

concurrency:
  group: "上涨样本筛选与归因分析-main"
  cancel-in-progress: false

jobs:
  attribution:
    name: "筛选历史上涨样本并分析事前特征"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置Python环境"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装免费开源研究依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "云端质量门禁"
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m pytest -q tests/test_uptrend_stock_attribution.py

      - name: "恢复兼容的历史分析断点"
        uses: actions/cache/restore@v5
        with:
          path: data/research/checkpoints/uptrend_stock_attribution.pkl
          key: aquant-uptrend-attribution-v1-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aquant-uptrend-attribution-v1-

      - name: "筛选上涨样本并分析信号日前因子"
        run: |
          set -euo pipefail
          python scripts/uptrend_stock_attribution.py --output data/backtest/uptrend_stock_attribution_latest.json

      - name: "失败或取消时保存检查点"
        if: ${{ failure() || cancelled() }}
        uses: actions/cache/save@v5
        with:
          path: data/research/checkpoints/uptrend_stock_attribution.pkl
          key: aquant-uptrend-attribution-v1-${{ github.run_id }}-${{ github.run_attempt }}

      - name: "保存上涨样本归因结果"
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: "上涨样本筛选与归因分析结果"
          path: data/backtest/uptrend_stock_attribution_latest.json
          if-no-files-found: warn
          retention-days: 30
