name: Historical Year Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    concurrency:
      group: historical-year-${{ matrix.year }}
      cancel-in-progress: false
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        year: [2015, 2016, 2017, 2018, 2019, 2020, 2021, 2022, 2023, 2024, 2025, 2026]
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backfill year
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/backfill_year.py --year ${{ matrix.year }}
