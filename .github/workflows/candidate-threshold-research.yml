name: Candidate Threshold Research

on:
  push:
    paths:
      - "scripts/candidate_threshold_research.py"
      - "tests/test_candidate_threshold_research.py"
      - ".github/workflows/candidate-threshold-research.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: candidate-threshold-research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 1
      - uses: actions/checkout@v5
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run candidate admission threshold research
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
        run: |
          export AQUANT_PRIVATE_STRATEGY_COMMIT="$(git -C .private-strategy rev-parse HEAD)"
          python scripts/candidate_threshold_research.py \
            --start 2015-01-05 \
            --end 2026-09-29 \
            --output data/research/candidate_thresholds.json
      - name: Validate research output
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path("data/research/candidate_thresholds.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          if d.get("status") != "ready":
              raise SystemExit("threshold research is not ready")
          if d.get("future_function") is not False:
              raise SystemExit("threshold research future-function audit failed")
          if d.get("strategy_commit") != "${{ env.AQUANT_PRIVATE_STRATEGY_COMMIT }}":
              print("strategy commit recorded in payload:", d.get("strategy_commit"))
          print("CANDIDATE THRESHOLD RESEARCH AUDIT PASS")
          PY
      - name: Commit research result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aquant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/candidate_thresholds.json
          if git diff --cached --quiet; then
            echo "No threshold research changes"
            exit 0
          fi
          git commit -m "research: evaluate candidate admission thresholds"
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
