name: 严格路径策略优化

on:
  push:
    branches: [main]
    paths:
      - "scripts/strict_path_strategy_score_mining.py"
      - "scripts/train_path_aware_model.py"
      - "scripts/short_term_research.py"
      - "requirements.txt"
      - ".github/workflows/strict-path-strategy-optimization.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: strict-path-strategy-optimization-main
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v6
      - name: 安装Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 程序质量检查
        run: python -m pytest -q
      - name: 拉取私有策略
        uses: actions/checkout@v6
        with:
          repository: 13415837267/Aquant-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy
          fetch-depth: 1
      - name: 严格路径评分优化研究
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
        run: |
          set -Eeuo pipefail
          export AQUANT_PRIVATE_STRATEGY_COMMIT="$(git -C .private-strategy rev-parse HEAD)"
          python scripts/strict_path_strategy_score_mining.py --start 2015-01-05 --final-end 2026-09-30
      - name: 上传研究结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strict-path-strategy-optimization
          path: data/backtest/strict_path_strategy_score_mining_latest.json
          retention-days: 30
      - name: 固化研究结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/strict_path_strategy_score_mining_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record strict path strategy optimization"
          git push origin HEAD:main
