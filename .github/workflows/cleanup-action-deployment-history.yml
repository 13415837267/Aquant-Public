name: "维护历史 Action 记录"

on:
  push:
    paths:
      - "scripts/cleanup_action_deployment_history.sh"
      - ".github/workflows/cleanup-action-deployment-history.yml"
  workflow_run:
    workflows:
      - "01 Python质量检查"
      - "02 数据维护"
      - "03 候选池生产"
      - "04 历史研究流水线"
      - "05 网页自动部署"
      - "06 模型研究"
      - "07 可执行净收益研究"
      - "07 历史候选回放"
      - "08 成对排序定向复核"
      - "09 路径感知模型可执行复利复核"
      - "10 上涨样本筛选与归因分析"
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: "历史记录维护-main"
  cancel-in-progress: false

jobs:
  cleanup:
    name: "清理失败或跳过的历史 Action"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: "检出当前主分支"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "停止本次维护提交意外触发的重复研究任务"
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r run_id expected_name; do
            if [[ -z "$run_id" ]]; then
              continue
            fi
            if ! actual_name="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.name' 2>/dev/null)"; then
              echo "指定运行已不存在，无需处理：$run_id"
              continue
            fi
            actual_status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status')"
            if [[ "$actual_name" != "$expected_name" ]]; then
              echo "拒绝处理运行 $run_id：实际名称与预期不匹配。"
              continue
            fi
            if [[ "$actual_status" == "completed" ]]; then
              echo "指定研究任务已经结束：$run_id"
              continue
            fi
            echo "正在停止维护提交意外触发的任务：$run_id $actual_name"
            gh api --method POST "repos/$REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null
            for attempt in $(seq 1 30); do
              actual_status="$(gh api "repos/$REPOSITORY/actions/runs/$run_id" --jq '.status' 2>/dev/null || printf 'unknown')"
              if [[ "$actual_status" == "completed" ]]; then
                break
              fi
              sleep 2
            done
            if [[ "$actual_status" != "completed" ]]; then
              echo "停止请求已发出，但无法在本步骤确认结束：$run_id"
              exit 1
            fi
            echo "已确认指定研究任务结束：$run_id"
          done <<'TARGETS'
          38222636390|07 可执行净收益研究
          38222636371|04 历史研究流水线
          38222636370|09 路径感知模型可执行复利复核
          38222636365|08 成对排序定向复核
          TARGETS

      - name: "清理无效历史记录并保留审计清单"
        shell: bash
        run: bash scripts/cleanup_action_deployment_history.sh
