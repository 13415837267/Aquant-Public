name: "维护历史 Action 记录"

on:
  push:
    paths:
      - "scripts/cleanup_action_deployment_history.sh"
      - ".github/workflows/cleanup-action-deployment-history.yml"
  workflow_run:
    workflows:
      - "01 Python质量检查"
      - "02 数据维护"
      - "03 候选池生产"
      - "04 历史研究流水线"
      - "05 网页自动部署"
      - "06 模型研究"
      - "07 可执行净收益研究"
      - "07 历史候选回放"
      - "08 成对排序定向复核"
      - "09 路径感知模型可执行复利复核"
      - "10 上涨样本筛选与归因分析"
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: "历史记录维护-main"
  cancel-in-progress: false

jobs:
  cleanup:
    name: "清理失败或跳过的历史 Action"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
    steps:
      - name: "检出当前主分支"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "清理无效历史记录并保留审计清单"
        shell: bash
        run: bash scripts/cleanup_action_deployment_history.sh
