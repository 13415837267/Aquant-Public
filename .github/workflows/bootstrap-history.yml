name: Historical Data Bootstrap
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate 3 recent trading days first; backfill only after validation passes"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - backfill
      days:
        description: "Number of recent trading days for validation"
        required: false
        default: "3"
        type: string
permissions:
  contents: write

concurrency:
  group: historical-data-bootstrap
  cancel-in-progress: true

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: Run bulk collector
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/backfill_history.py --mode ${{ inputs.mode }} --days ${{ inputs.days }}
