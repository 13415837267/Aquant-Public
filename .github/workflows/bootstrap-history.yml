name: Historical Data Bootstrap

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "validate daily, validate fundamentals, backfill a layer, or build the full database"
        required: true
        default: "validate"
        type: choice
        options:
          - validate
          - validate_fundamentals
          - backfill
          - fundamentals
          - full
      days:
        description: "Number of recent trading days for daily validation"
        required: false
        default: "3"
        type: string

permissions:
  contents: write

concurrency:
  group: historical-data-bootstrap
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run database collector
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/backfill_history.py --mode ${{ inputs.mode }} --days ${{ inputs.days }}
