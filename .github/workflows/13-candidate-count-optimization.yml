name: "13 候选数量独立参数复核"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"
  PYTHONWARNINGS: "error"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/13-candidate-count-optimization.yml"
      - "scripts/candidate_count_operating_point_research.py"
      - "tests/test_candidate_count_operating_point_research.py"
      - "docs/每日候选数量对照研究.md"
      - "scripts/path_aware_gbdt_compound_backtest.py"
      - "scripts/train_path_aware_gbdt.py"
      - "scripts/compound_portfolio_backtest.py"
      - "config/选股条件研究配置.json"

permissions:
  contents: read

concurrency:
  group: "候选数量独立参数复核-main"
  cancel-in-progress: false

jobs:
  research:
    name: "分别优化Top1与Top2并进行冻结复核"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "检出公开仓库与既有历史行情"
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 1

      - name: "设置Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装项目依赖"
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "检查语法与完整测试；所有Python警告视为错误"
        run: |
          set -euo pipefail
          python -W error -m compileall -q scripts tests
          python -W error -m pytest -q

      - name: "运行Top1与Top2独立选参研究"
        run: |
          set -euo pipefail
          mkdir -p data/backtest
          python -W error scripts/candidate_count_operating_point_research.py \
            --output data/backtest/candidate_count_operating_point_latest.json

      - name: "保存参数独立选择与相邻敏感性结果"
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "候选数量独立参数复核-${{ github.run_id }}"
          path: data/backtest/candidate_count_operating_point_latest.json
          if-no-files-found: warn
          retention-days: 30

      - name: "输出研究结果摘要"
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("data/backtest/candidate_count_operating_point_latest.json")
          if not path.exists():
              print("本轮尚未生成完整结果文件。请核对前序步骤日志；不得把不完整运行视为研究成功。")
              raise SystemExit(0)
          result = json.loads(path.read_text(encoding="utf-8"))
          print("## 候选数量独立参数复核")
          print()
          print("状态：", result.get("status"))
          print("训练样本：", result.get("model", {}).get("training_samples"))
          for top_k, study in result.get("candidate_count_studies", {}).items():
              print()
              print(f"### 每日最多{top_k}只")
              print("状态：", study.get("status"))
              print("达标参数组合数：", study.get("eligible_parameter_count"))
              print("验证期选中参数：", json.dumps(study.get("validation_selected_point"), ensure_ascii=False))
              print("历史补充结果：", json.dumps(study.get("final_supplemental"), ensure_ascii=False))
              print("相邻参数敏感性组合数：", len(study.get("neighbor_sensitivity", [])))
          print()
          print("该研究不修改正式策略或自动下单状态；历史补充期不是全新独立留出集。")
          PY
