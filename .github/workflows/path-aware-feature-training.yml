name: 路径感知特征训练

on:
  push:
    branches: [main]
    paths:
      - "scripts/train_path_aware_model.py"
      - "scripts/short_term_research.py"
      - "requirements.txt"
      - ".github/workflows/path-aware-feature-training.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: path-aware-feature-training-main
  cancel-in-progress: false

jobs:
  train:
    name: 路径感知特征训练
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v6
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: Python 质量检查
        run: python -m pytest -q
      - name: 运行路径感知全市场训练
        shell: bash
        run: |
          set -Eeuo pipefail
          mkdir -p runtime
          python scripts/train_path_aware_model.py --start 2015-01-05 --final-end 2026-09-30
      - name: 上传研究产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-aware-feature-training
          path: data/backtest/path_aware_feature_training_latest.json
          retention-days: 30
      - name: 提交研究结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/path_aware_feature_training_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record path-aware feature training"
          git push origin HEAD:main
