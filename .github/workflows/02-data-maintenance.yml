name: "02 数据维护"

on:
  schedule:
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "数据维护-main"
  cancel-in-progress: false

jobs:
  maintain:
    name: "交易日数据维护"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: "检出代码"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装Python依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "检查A股交易日"
        id: trading_day
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: |
          python scripts/check_trading_day.py | tee trading_day_check.txt
          if grep -q "IS_TRADING_DAY=true" trading_day_check.txt; then
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_trading_day=false" >> "$GITHUB_OUTPUT"
          fi

      - name: "跳过非交易日"
        if: steps.trading_day.outputs.is_trading_day != 'true'
        run: echo "当前北京时间不是A股交易日，跳过市场数据更新。"

      - name: "更新日线历史数据"
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/backfill_history.py --mode backfill

      - name: "验证最新日线数据"
        if: steps.trading_day.outputs.is_trading_day == 'true'
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/backfill_history.py --mode validate --days 3
