name: 网页质量检查

on:
  pull_request:
    paths:
      - "app/**"
      - "data/candidates.json"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/web-quality.yml"
  workflow_dispatch:

concurrency:
  group: web-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v5
      - name: 设置Node.js环境
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: 安装依赖
        run: npm install
      - name: 构建静态网页
        run: npm run build
