name: 网页质量检查

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "app/**"
      - "data/candidates.json"
      - "data/next_trading_day_plan.json"
      - "data/system_audit.json"
      - "package.json"
      - "package-lock.json"
      - "next.config.*"
      - "tsconfig.json"
      - ".github/workflows/web-quality.yml"

permissions:
  contents: read

concurrency:
  group: web-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: 网页构建质量检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v6
      - name: 设置Node.js环境
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          package-manager-cache: false
      - name: 安装依赖
        run: npm ci
      - name: 构建静态网页
        run: npm run build
