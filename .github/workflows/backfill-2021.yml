name: Historical 2021 Backfill

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backfill:
    concurrency:
      group: historical-year-2021
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Backfill 2021
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/backfill_year.py --year 2021
