name: 最新候选扫描

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/update_candidates.py"
      - "scripts/validate_candidates.py"
      - "tests/**"
      - "scripts/next_trading_day_plan.py"

permissions:
  contents: write
  actions: read

concurrency:
  group: latest-candidate-scan-main
  cancel-in-progress: true

jobs:
  scan:
    name: 最新候选扫描
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v6
      - name: 检出私有策略
        uses: actions/checkout@v6
        with:
          repository: 13415837267/Aquant-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy
          fetch-depth: 1
      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 程序质量检查
        run: python -m pytest -q
      - name: 生成最新候选
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: ${{ github.sha }}
        run: |
          set -Eeuo pipefail
          export AQUANT_PRIVATE_STRATEGY_COMMIT="$(git -C .private-strategy rev-parse HEAD)"
          python scripts/update_candidates.py
      - name: 验证候选池
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: ${{ github.sha }}
        run: python scripts/validate_candidates.py
      - name: 生成下一交易日计划
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/next_trading_day_plan.py
      - name: 验证下一交易日计划
        run: python scripts/next_trading_day_plan.py --validate
      - name: 固化候选
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/next_trading_day_plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "signal: record latest candidates"
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
