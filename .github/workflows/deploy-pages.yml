name: 网页部署

on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    name: 构建网页
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: 检出仓库
        uses: actions/checkout@v6

      - name: 设置 GitHub Pages
        uses: actions/configure-pages@v5

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: 安装依赖
        run: npm install

      - name: 构建静态网页
        run: npm run build

      - name: 上传网页构建产物
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./out

  deploy:
    name: 部署网页
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
