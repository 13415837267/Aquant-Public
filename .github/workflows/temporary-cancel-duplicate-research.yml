name: "临时维护：停止旧并发组重复研究"

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/temporary-cancel-duplicate-research.yml"

permissions:
  actions: write
  contents: read

jobs:
  cancel_obsolete_research:
    name: "核验并停止旧版本重复研究"
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: "核验运行编号、工作流与提交版本后定向取消"
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: "38273730344"
          EXPECTED_SHA: "f4e92fe6c965c8ef7831a5048cdce5c0cf284ca7"
          EXPECTED_PATH: ".github/workflows/11-after-close-strategy-research.yml"
          EXPECTED_NAME: "11 盘后选股策略统一研究"
        shell: bash
        run: |
          set -euo pipefail
          api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}"
          read_run() {
            curl --fail --silent --show-error --retry 3 --retry-delay 2 \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "${api}"
          }

          echo "阶段一：读取指定运行记录并核对身份。"
          metadata="$(read_run)"
          actual_name="$(jq -r '.name' <<< "${metadata}")"
          actual_path="$(jq -r '.path' <<< "${metadata}")"
          actual_sha="$(jq -r '.head_sha' <<< "${metadata}")"
          actual_status="$(jq -r '.status' <<< "${metadata}")"
          actual_conclusion="$(jq -r '.conclusion // ""' <<< "${metadata}")"

          if [[ "${actual_name}" != "${EXPECTED_NAME}" \
             || "${actual_path}" != "${EXPECTED_PATH}" \
             || "${actual_sha}" != "${EXPECTED_SHA}" ]]; then
            echo "::error::运行身份与预期不一致，安全中止；未发送取消请求。"
            echo "读取到的名称：${actual_name}"
            echo "读取到的工作流：${actual_path}"
            echo "读取到的提交：${actual_sha}"
            exit 1
          fi

          if [[ "${actual_status}" != "in_progress" ]]; then
            echo "指定运行已不在运行状态；无需取消。当前状态：${actual_status}，结论：${actual_conclusion:-无}。"
            exit 0
          fi

          echo "阶段二：已确认这是旧并发组的重复研究，提交取消请求。"
          http_code="$(curl --silent --show-error --output /tmp/cancel-response.txt \
            --write-out "%{http_code}" --request POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "${api}/cancel")"
          if [[ "${http_code}" != "202" && "${http_code}" != "204" ]]; then
            echo "::error::取消请求返回 HTTP ${http_code}。"
            cat /tmp/cancel-response.txt
            exit 1
          fi

          echo "阶段三：轮询确认运行结束，最新并发组运行不会被本任务触碰。"
          for attempt in $(seq 1 24); do
            metadata="$(read_run)"
            actual_status="$(jq -r '.status' <<< "${metadata}")"
            actual_conclusion="$(jq -r '.conclusion // ""' <<< "${metadata}")"
            if [[ "${actual_status}" == "completed" ]]; then
              echo "指定旧运行已结束，结论：${actual_conclusion}。"
              exit 0
            fi
            echo "核验进度：第 ${attempt}/24 次，当前状态 ${actual_status}。"
            sleep 5
          done

          echo "::error::已提交取消请求，但两分钟内未确认运行终态；需要再次核验，不能把请求成功视为取消完成。"
          exit 1
