name: "07 历史候选回放"

on:
  workflow_dispatch:
    inputs:
      signal_date:
        description: "信号日期（北京时间，必须是已有交易日）"
        required: true
        default: "2026-09-28"
        type: string

permissions:
  contents: write

concurrency:
  group: "历史候选回放-main"
  cancel-in-progress: false

jobs:
  replay:
    name: "云端历史候选回放"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "检出固定Private策略"
        uses: actions/checkout@v7
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          path: private-strategy
          token: ${{ secrets.AQUANT_PRIVATE_TOKEN }}
          fetch-depth: 1

      - name: "验证策略源提交"
        run: |
          set -euo pipefail
          ACTUAL_PRIVATE_COMMIT="$(git -C private-strategy rev-parse HEAD)"
          test "$ACTUAL_PRIVATE_COMMIT" = "bd395f5577b4247ac621293dfb3a248a7b1d1e00"

      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "验证固定第一版模型"
        run: |
          set -euo pipefail
          test -f data/models/production_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("config/production_release_v1.json").read_text(encoding="utf-8"))
          model = json.loads(Path("data/models/production_v1.json").read_text(encoding="utf-8"))
          baseline = release["model_baseline"]
          assert model["model_code_commit"] == baseline["model_code_commit"]
          assert model["training_start"] == baseline["training_start"]
          assert model["training_end"] == baseline["training_end"]
          print("固定模型校验通过；历史回放不重新训练。")
          PY

      - name: "执行指定日期固定模型历史回放"
        run: |
          set -euo pipefail
          mkdir -p data/research/historical_candidates
          DATE="${{ inputs.signal_date }}"
          python scripts/generate_research_candidates.py --signal-date "$DATE" --threshold 0.60 --model data/models/production_v1.json --output "data/research/historical_candidates/$DATE.json"
      - name: "验证指定日期回放边界"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          for p in sorted(Path("data/research/historical_candidates").glob("*.json")):
              date = p.stem
              p = Path("data/research/historical_candidates") / f"{date}.json"
              r = json.loads(p.read_text(encoding="utf-8"))
              assert r["future_function"] is False
              assert r["model_definition"]["training_end"] == "2026-09-30"
              assert r["model_definition"]["model_data_cutoff"] == "2026-09-30"
              assert r["model_definition"]["signal_data_cutoff"] == date
              assert r["history_window_end"] == date
              assert r["model_definition"]["probability_threshold"] == 0.60
              assert r["model_definition"]["top_k"] == 2
              print(json.dumps({
                  "signal_date": date,
                  "candidates": [
                      {"rank": x["rank"], "symbol": x["symbol"], "name": x["name"], "probability": x["precision_probability"]}
                      for x in r["candidates"]
                  ]
              }, ensure_ascii=False, indent=2))
          PY

      - name: "提交历史回放结果"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/research/historical_candidates
          if git diff --cached --quiet; then
            echo "历史回放结果无变化，无需提交。"
          else
            git commit -m "研究：完成9月28日与9月29日历史候选回放"
            git push
          fi
