name: Historical Backtest

on:
  workflow_dispatch:
    inputs:
      start:
        description: "Signal start date (database trading date)"
        required: true
        default: "2015-01-05"
      end:
        description: "Signal end date (database trading date)"
        required: true
        default: "2026-09-29"
      top_n:
        description: "Equal-weight portfolio size"
        required: true
        default: "30"
      cost_bps:
        description: "Transaction cost (bps of turnover)"
        required: true
        default: "3"
      slippage_bps:
        description: "Slippage (bps of turnover)"
        required: true
        default: "2"

permissions:
  contents: write

concurrency:
  group: historical-backtest
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6

      - name: Checkout private strategy
        uses: actions/checkout@v6
        with:
          repository: 13415837267/Aquant-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve strategy commit
        id: strategy
        shell: bash
        run: |
          echo "commit=$(git -C .private-strategy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run historical backtest
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: ${{ steps.strategy.outputs.commit }}
        run: |
          python scripts/backtest.py \
            --start "${{ inputs.start }}" \
            --end "${{ inputs.end }}" \
            --top-n "${{ inputs.top_n }}" \
            --cost-bps "${{ inputs.cost_bps }}" \
            --slippage-bps "${{ inputs.slippage_bps }}"

      - name: Commit backtest result
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/latest.json
          if git diff --cached --quiet; then
            echo "No backtest result changes."
            exit 0
          fi
          git commit -m "research: update historical backtest"
          git push

