name: Regime Factor Diagnostics

on:
  push:
    paths:
      - "scripts/regime_factor_diagnostics.py"
  workflow_dispatch:
    inputs:
      start: {description: "History start", required: true, default: "2015-01-05"}
      end: {description: "History end", required: true, default: "2026-09-29"}
      top_n: {description: "Portfolio size", required: true, default: "30"}

permissions:
  contents: write

concurrency:
  group: regime-factor-diagnostics
  cancel-in-progress: true

jobs:
  diagnostics:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - uses: actions/checkout@v6
        with:
          repository: 13415837267/Aquant-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Resolve parameters
        id: params
        shell: bash
        env:
          WF_START: '${{ inputs.start }}'
          WF_END: '${{ inputs.end }}'
          WF_TOP_N: '${{ inputs.top_n }}'
        run: |
          echo "start=${WF_START:-2015-01-05}" >> "$GITHUB_OUTPUT"
          echo "end=${WF_END:-2026-09-29}" >> "$GITHUB_OUTPUT"
          echo "top_n=${WF_TOP_N:-30}" >> "$GITHUB_OUTPUT"

      - name: Resolve strategy commit
        id: strategy
        shell: bash
        run: echo "commit=$(git -C .private-strategy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run diagnostics
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: ${{ steps.strategy.outputs.commit }}
        run: |
          python scripts/regime_factor_diagnostics.py             --start "${{ steps.params.outputs.start }}"             --end "${{ steps.params.outputs.end }}"             --top-n "${{ steps.params.outputs.top_n }}"             --output data/backtest/regime_factor_diagnostics.json

      - name: Publish
        shell: bash
        env:
          RESULT_FILE: data/backtest/regime_factor_diagnostics.json
        run: |
          set -euo pipefail
          TMP_RESULT="$RUNNER_TEMP/regime_factor_diagnostics.json"
          cp "$RESULT_FILE" "$TMP_RESULT"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$TMP_RESULT" "$RESULT_FILE"
            git add "$RESULT_FILE"
            if git diff --cached --quiet; then
              exit 0
            fi
            git commit -m "research: update regime factor diagnostics"
            if git push origin HEAD:main; then
              exit 0
            fi
          done
          echo "failed to publish diagnostics after retries" >&2
          exit 1
