name: "05 网页自动部署"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - "data/candidates.json"
      - "data/next_trading_day_plan.json"
      - "data/production_status.json"
      - "data/system_audit.json"
      - "data/research_status.json"
      - "data/research_trial_status.json"
      - "data/trading_day_status.json"
      - "config/system_version.json"
      - ".github/workflows/05-web-deploy.yml"
  workflow_run:
    workflows: ["03 候选池生产"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_note:
        description: "手动部署时填写本次调试目的"
        required: false
        default: "手动验证网页部署链路"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "网页部署-main"
  cancel-in-progress: true

jobs:
  verify_snapshot:
    name: "验证最新有效研究快照"
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: "检出最新公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "核验候选日期、策略来源与研究/发布状态"
        id: check
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from datetime import date, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          root = Path(".")
          tz = ZoneInfo("Asia/Shanghai")
          today = datetime.now(tz).date().isoformat()
          status_path = root / "data/trading_day_status.json"
          candidates_path = root / "data/candidates.json"
          plan_path = root / "data/next_trading_day_plan.json"
          manifest_path = root / "config/system_version.json"
          reasons = []

          event_name = os.environ.get("EVENT_NAME", "")
          upstream_conclusion = os.environ.get("UPSTREAM_CONCLUSION", "")
          if event_name == "workflow_run" and upstream_conclusion != "success":
              reasons.append(f"上游候选生产未成功（{upstream_conclusion or '无结论'}），拒绝部署。")

          required_paths = (status_path, candidates_path, plan_path, manifest_path)
          missing = [str(path) for path in required_paths if not path.is_file()]
          if missing:
              reasons.append("缺少必要快照文件：" + "、".join(missing))
          else:
              status = json.loads(status_path.read_text(encoding="utf-8"))
              candidates = json.loads(candidates_path.read_text(encoding="utf-8"))
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

              checked_at = datetime.fromisoformat(status["checked_at"])
              checked_date = checked_at.astimezone(tz).date().isoformat()
              if checked_date != today:
                  reasons.append(f"交易日状态不是今日检查结果：状态日期={checked_date}，当前日期={today}。")

              history_dates = set()
              for path in (root / "data/history").glob("*/*.csv.gz"):
                  try:
                      value = date.fromisoformat(path.name[:10]).isoformat()
                  except ValueError:
                      continue
                  history_dates.add(value)
              latest_history_date = max(history_dates) if history_dates else None
              candidate_date = str(candidates.get("as_of", ""))[:10]
              plan_signal_date = str(plan.get("signal_date", ""))[:10]
              plan_data_cutoff = str(plan.get("data_cutoff", ""))[:10]
              plan_execution_date = str(plan.get("next_trading_day", ""))[:10]
              try:
                  execution_date = date.fromisoformat(plan_execution_date).isoformat()
              except ValueError:
                  reasons.append("下一交易日计划的执行日期无效。")
              else:
                  if execution_date <= today:
                      reasons.append(
                          f"计划执行日={execution_date} 已到或已过当前日期={today}，不部署已过期模拟计划。"
                      )
              manifest_version = manifest.get("system_version")
              manifest_strategy = manifest.get("strategy_version")
              manifest_commit = manifest.get("strategy_commit")

              if latest_history_date is None:
                  reasons.append("历史行情目录没有可用的交易日文件。")
              elif candidate_date != latest_history_date:
                  reasons.append(
                      f"候选数据日期={candidate_date}，最新已落库交易日={latest_history_date}，不一致。"
                  )

              if candidates.get("status") != "ready":
                  reasons.append(f"候选快照状态不是 ready：{candidates.get('status')!r}。")
              if candidates.get("future_function") is not False:
                  reasons.append("候选快照未明确通过未来函数检查。")
              if candidates.get("system_version") != manifest_version:
                  reasons.append("候选系统版本与版本清单不一致。")
              if candidates.get("strategy_version") != manifest_strategy or manifest_version != manifest_strategy:
                  reasons.append("候选策略版本与系统版本清单不一致。")
              if candidates.get("strategy_commit") != manifest_commit or not manifest_commit:
                  reasons.append("候选策略提交与当前快照版本清单不一致。")
              if candidates.get("production_release") is not False or manifest.get("production_release") is not False:
                  reasons.append("研究候选快照的正式发布状态不安全。")
              if manifest.get("automatic_ordering") is not False:
                  reasons.append("系统自动下单未明确保持关闭。")

              if plan.get("status") not in {"research_plan", "production_plan"}:
                  reasons.append(f"下一交易日计划状态无效：{plan.get('status')!r}。")
              if plan_signal_date != candidate_date or plan_data_cutoff != candidate_date:
                  reasons.append("计划信号日期/数据截止日与候选数据日期不一致。")
              source_snapshot = plan.get("source_snapshot") or {}
              if source_snapshot.get("as_of") != candidates.get("as_of"):
                  reasons.append("计划来源快照与活动候选快照不一致。")
              if plan.get("strategy_version") != manifest_strategy or plan.get("strategy_commit") != manifest_commit:
                  reasons.append("计划策略版本或提交与当前版本清单不一致。")
              if plan.get("production_release") is not False:
                  reasons.append("计划未保持研究/模拟状态。")

              production_path = root / "data/production_status.json"
              if not production_path.is_file():
                  reasons.append("缺少正式发布状态文件。")
              else:
                  production = json.loads(production_path.read_text(encoding="utf-8"))
                  if production.get("release_gate") is not False:
                      reasons.append("正式发布门禁未保持关闭。")
                  if production.get("automatic_ordering") is not False:
                      reasons.append("生产状态文件未明确关闭自动下单。")

              if candidate_date and latest_history_date and candidate_date == latest_history_date:
                  print(f"候选数据日期与最新已落库交易日一致：{latest_history_date}。")
              print(
                  "交易日状态："
                  + ("交易日" if status.get("is_trading_day") else "非交易日")
                  + f"；检查日期={checked_date}；当前日期={today}。"
              )
              print("非交易日不再阻断最近完整交易日研究快照部署。")

          ready = not reasons
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          for reason in reasons:
              print("[部署校验未通过] " + reason)
          if ready:
              print("当前研究候选、模拟计划、策略来源与最新已落库行情已一致，允许构建网页。")
          else:
              print("快照校验未通过；本次不会构建或部署网页。")
          PY

  build:
    name: "构建研究系统网页"
    needs: verify_snapshot
    if: ${{ always() && needs.verify_snapshot.result == 'success' && needs.verify_snapshot.outputs.ready == 'true' }}
    runs-on: ubuntu-24.04
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7

      - name: "设置Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: "安装网页依赖"
        run: npm install --no-audit --no-fund

      - name: "构建静态网页"
        run: npm run build

      - name: "上传网页构建产物"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: "部署研究系统网页"
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_DEPLOY_POLL_SECONDS: "5"
      PAGES_DEPLOY_TIMEOUT_SECONDS: "600"
      PAGES_DEPLOY_MAX_ERRORS: "10"
      PAGES_DEPLOY_ENVIRONMENT: "aquant-pages-auto"
    environment:
      # 使用独立的自动发布环境，避免 github-pages 环境的审批保护规则将每日自动更新永久挂起。
      name: aquant-pages-auto
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "通过GitHub Pages官方接口部署并核验状态"
        id: deployment
        run: |
          set -euo pipefail
          api="https://api.github.com"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          echo "[部署进度] 查找本次运行生成的网页构建工件。"
          artifact_response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 "${headers[@]}" \
            "${api}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -er '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | if length == 1 then .[0].id else error("当前运行必须且只能有一个有效的 github-pages 工件") end' <<< "${artifact_response}")"
          echo "[部署进度] 已确认网页工件编号：${artifact_id}。"

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "[部署失败] 缺少 GitHub Actions OIDC 请求环境，拒绝绕过身份校验。" >&2
            exit 1
          fi
          oidc_response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_token="$(jq -er '.value' <<< "${oidc_response}")"

          payload="$(jq -n \
            --argjson artifact_id "${artifact_id}" \
            --arg pages_build_version "${GITHUB_SHA}" \
            --arg environment "${PAGES_DEPLOY_ENVIRONMENT}" \
            --arg oidc_token "${oidc_token}" \
            '{artifact_id: $artifact_id, environment: $environment, pages_build_version: $pages_build_version, oidc_token: $oidc_token}')"
          echo "[部署进度] 向 GitHub Pages 官方部署接口提交工件及 OIDC 身份证明。"
          deployment_response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "${headers[@]}" -H "Content-Type: application/json" \
            "${api}/repos/${GITHUB_REPOSITORY}/pages/deployments" \
            --data "${payload}")"
          deployment_id="$(jq -er '(.id // .pages_build_version // empty) | tostring' <<< "${deployment_response}")"
          if [[ -z "${deployment_id}" ]]; then
            echo "[部署失败] 官方接口没有返回部署编号。" >&2
            exit 1
          fi
          echo "[部署进度] 已创建部署：${deployment_id}。"

          deadline=$((SECONDS + PAGES_DEPLOY_TIMEOUT_SECONDS))
          api_errors=0
          while (( SECONDS < deadline )); do
            if status_response="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 1 \
              "${headers[@]}" "${api}/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}")"; then
              api_errors=0
              deployment_status="$(jq -er '.status // "unknown_status"' <<< "${status_response}")"
              echo "[部署进度] 当前状态：${deployment_status}。"
              case "${deployment_status}" in
                succeed)
                  page_response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
                    "${headers[@]}" "${api}/repos/${GITHUB_REPOSITORY}/pages")"
                  page_url="$(jq -er '.html_url' <<< "${page_response}")"
                  echo "page_url=${page_url}" >> "${GITHUB_OUTPUT}"
                  echo "[部署完成] 网页已成功发布：${page_url}"
                  exit 0
                  ;;
                deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                  echo "[部署失败] GitHub Pages 返回终态：${deployment_status}。" >&2
                  exit 1
                  ;;
              esac
            else
              api_errors=$((api_errors + 1))
              echo "[部署重试] 查询部署状态失败（${api_errors}/${PAGES_DEPLOY_MAX_ERRORS}）。" >&2
              if (( api_errors >= PAGES_DEPLOY_MAX_ERRORS )); then
                echo "[部署失败] 官方接口连续查询失败次数超过上限。" >&2
                exit 1
              fi
            fi
            sleep "${PAGES_DEPLOY_POLL_SECONDS}"
          done

          echo "[部署失败] 等待 GitHub Pages 部署完成超时。" >&2
          curl --fail --silent --show-error -X POST "${headers[@]}" \
            "${api}/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}/cancel" >/dev/null || true
          exit 1
