name: "05 网页自动部署"

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "data/candidates.json"
      - "data/next_trading_day_plan.json"
      - "data/production_status.json"
      - "data/research_trial_status.json"
      - "data/research_status.json"
      - "data/trading_day_status.json"
      - "data/web_deploy_trigger.json"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
  workflow_run:
    workflows: ["03 候选池生产"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_note:
        description: "手动部署时填写本次调试目的"
        required: false
        default: "手动验证网页部署链路"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "网页部署-main"
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    name: "构建第一版系统网页"
    runs-on: ubuntu-24.04
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7

      - name: "设置Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: "安装网页依赖"
        run: npm install --no-audit --no-fund

      - name: "构建静态网页"
        run: npm run build

      - name: "上传网页构建产物"
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    name: "部署第一版系统网页"
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "部署到GitHub Pages"
        id: deployment
        uses: actions/deploy-pages@v4
