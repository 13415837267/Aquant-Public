name: "05 网页自动部署"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - "public/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/05-web-deploy.yml"
  workflow_run:
    workflows: ["03 候选池生产"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      debug_note:
        description: "手动部署时填写本次调试目的"
        required: false
        default: "手动验证网页部署链路"
        type: string

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: "网页部署-main"
  cancel-in-progress: true

jobs:
  verify_snapshot:
    name: "验证候选快照是否为今日正式结果"
    if: ${{ github.event_name == 'workflow_run' }}
    runs-on: ubuntu-24.04
    outputs:
      ready: ${{ steps.check.outputs.ready }}
    steps:
      - name: "检出最新公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "校验交易日状态与候选日期"
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "上游候选生产未成功，拒绝部署网页。" >&2
            exit 1
          fi
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Shanghai")
          today = datetime.now(tz).date().isoformat()
          status_path = Path("data/trading_day_status.json")
          candidates_path = Path("data/candidates.json")
          plan_path = Path("data/next_trading_day_plan.json")

          ready = False
          reasons = []
          if not status_path.exists() or not candidates_path.exists() or not plan_path.exists():
              reasons.append("缺少交易日状态、候选快照或下一交易日计划文件。")
          else:
              status = json.loads(status_path.read_text(encoding="utf-8"))
              candidates = json.loads(candidates_path.read_text(encoding="utf-8"))
              plan = json.loads(plan_path.read_text(encoding="utf-8"))
              checked_at = datetime.fromisoformat(status["checked_at"])
              checked_date = checked_at.astimezone(tz).date().isoformat()
              candidate_date = str(candidates.get("as_of", ""))[:10]
              plan_signal_date = str(plan.get("signal_date", ""))
              if not status.get("is_trading_day"):
                  reasons.append("最新交易日状态为非交易日，不部署旧候选快照。")
              if checked_date != today:
                  reasons.append(f"交易日状态不是今日检查结果：状态日期={checked_date}，当前日期={today}。")
              if candidates.get("status") != "ready":
                  reasons.append("候选快照状态不是 ready。")
              if candidate_date != today:
                  reasons.append(f"候选快照日期={candidate_date}，不等于今日={today}。")
              if plan_signal_date != today:
                  reasons.append(f"下一交易日计划信号日期={plan_signal_date}，不等于今日={today}。")
              ready = not reasons

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"ready={str(ready).lower()}\n")
          for reason in reasons:
              print(reason)
          if ready:
              print(f"正式候选快照、交易日状态和计划均对应 {today}，允许部署网页。")
          else:
              print("本次不部署；待今日候选生产成功后由工作流再次触发。")
          PY

  build:
    name: "构建研究系统网页"
    needs: verify_snapshot
    if: ${{ always() && (github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && needs.verify_snapshot.result == 'success' && needs.verify_snapshot.outputs.ready == 'true')) }}
    runs-on: ubuntu-24.04
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7

      - name: "设置Node.js"
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: "安装网页依赖"
        run: npm install --no-audit --no-fund

      - name: "构建静态网页"
        run: npm run build

      - name: "上传网页构建产物"
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    name: "部署研究系统网页"
    needs: build
    if: ${{ always() && needs.build.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
      PAGES_DEPLOY_POLL_SECONDS: "5"
      PAGES_DEPLOY_TIMEOUT_SECONDS: "600"
      PAGES_DEPLOY_MAX_ERRORS: "10"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: "通过GitHub Pages官方接口部署并核验状态"
        id: deployment
        run: |
          set -euo pipefail
          api="https://api.github.com"
          headers=(
            -H "Accept: application/vnd.github+json"
            -H "Authorization: Bearer ${GH_TOKEN}"
            -H "X-GitHub-Api-Version: 2022-11-28"
          )

          echo "[部署进度] 查找本次运行生成的网页构建工件。"
          artifact_response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 "${headers[@]}" \
            "${api}/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100")"
          artifact_id="$(jq -er '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | if length == 1 then .[0].id else error("当前运行必须且只能有一个有效的 github-pages 工件") end' <<< "${artifact_response}")"
          echo "[部署进度] 已确认网页工件编号：${artifact_id}。"

          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "[部署失败] 缺少 GitHub Actions OIDC 请求环境，拒绝绕过身份校验。" >&2
            exit 1
          fi
          oidc_response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          oidc_token="$(jq -er '.value' <<< "${oidc_response}")"

          payload="$(jq -n \
            --argjson artifact_id "${artifact_id}" \
            --arg pages_build_version "${GITHUB_SHA}" \
            --arg oidc_token "${oidc_token}" \
            '{artifact_id: $artifact_id, pages_build_version: $pages_build_version, oidc_token: $oidc_token}')"
          echo "[部署进度] 向 GitHub Pages 官方部署接口提交工件及 OIDC 身份证明。"
          deployment_response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
            -X POST "${headers[@]}" -H "Content-Type: application/json" \
            "${api}/repos/${GITHUB_REPOSITORY}/pages/deployments" \
            --data "${payload}")"
          deployment_id="$(jq -er '(.id // .pages_build_version // empty) | tostring' <<< "${deployment_response}")"
          if [[ -z "${deployment_id}" ]]; then
            echo "[部署失败] 官方接口没有返回部署编号。" >&2
            exit 1
          fi
          echo "[部署进度] 已创建部署：${deployment_id}。"

          deadline=$((SECONDS + PAGES_DEPLOY_TIMEOUT_SECONDS))
          api_errors=0
          while (( SECONDS < deadline )); do
            if status_response="$(curl --fail --silent --show-error --retry 2 --retry-all-errors --retry-delay 1 \
              "${headers[@]}" "${api}/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}")"; then
              api_errors=0
              deployment_status="$(jq -er '.status // "unknown_status"' <<< "${status_response}")"
              echo "[部署进度] 当前状态：${deployment_status}。"
              case "${deployment_status}" in
                succeed)
                  page_response="$(curl --fail --silent --show-error --retry 3 --retry-all-errors --retry-delay 2 \
                    "${headers[@]}" "${api}/repos/${GITHUB_REPOSITORY}/pages")"
                  page_url="$(jq -er '.html_url' <<< "${page_response}")"
                  echo "page_url=${page_url}" >> "${GITHUB_OUTPUT}"
                  echo "[部署完成] 网页已成功发布：${page_url}"
                  exit 0
                  ;;
                deployment_failed|deployment_content_failed|deployment_cancelled|deployment_lost)
                  echo "[部署失败] GitHub Pages 返回终态：${deployment_status}。" >&2
                  exit 1
                  ;;
              esac
            else
              api_errors=$((api_errors + 1))
              echo "[部署重试] 查询部署状态失败（${api_errors}/${PAGES_DEPLOY_MAX_ERRORS}）。" >&2
              if (( api_errors >= PAGES_DEPLOY_MAX_ERRORS )); then
                echo "[部署失败] 官方接口连续查询失败次数超过上限。" >&2
                exit 1
              fi
            fi
            sleep "${PAGES_DEPLOY_POLL_SECONDS}"
          done

          echo "[部署失败] 等待 GitHub Pages 部署完成超时。" >&2
          curl --fail --silent --show-error -X POST "${headers[@]}" \
            "${api}/repos/${GITHUB_REPOSITORY}/pages/deployments/${deployment_id}/cancel" >/dev/null || true
          exit 1
