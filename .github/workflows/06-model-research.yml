name: "06 模型研究"

# 研究条件、特征与模型脚本变化时，在GitHub云端重新训练和验证。
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/06-model-research.yml"
      - "config/选股条件研究配置.json"
      - "scripts/selection_factor_catalog.py"
      - "scripts/high_precision_profit_mining.py"
      - "scripts/train_path_aware_gbdt.py"
      - "scripts/train_short_term_model.py"
      - "scripts/train_executable_path_model.py"
      - "scripts/short_term_research.py"
      - "scripts/train_path_aware_model.py"
      - "scripts/path_rule_mining.py"
      - "scripts/path_regime_rule_mining.py"
      - "scripts/strict_path_strategy_score_mining.py"
      - "scripts/pack_all_condition_results.py"
      - "scripts/compound_portfolio_backtest.py"
      - "scripts/run_all_conditions_research.py"
      - "scripts/research_checkpoint_runner.py"
      - "requirements.txt"
      - "scripts/pairwise_rank_compound_backtest.py"
      - "tests/test_pairwise_ranking_model.py"

permissions:
  contents: read

concurrency:
  group: "模型研究-main"
  cancel-in-progress: false

jobs:
  research:
    name: "云端短线模型研究"
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置Python环境"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装研究依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "预检历史行情覆盖与训练边界"
        run: |
          python - <<'PY'
          from collections import Counter
          from scripts.short_term_research import history_files

          files = history_files()
          dates = [path.name[:10] for path in files]
          required_dates = (
              "2015-01-05",
              "2022-12-30",
              "2023-01-03",
              "2024-12-31",
              "2025-01-02",
              "2026-09-30",
          )
          date_set = set(dates)
          missing = [day for day in required_dates if day not in date_set]
          year_counts = Counter(day[:4] for day in dates)

          print("历史行情文件数：", len(files))
          print("实际数据范围：", dates[0], "至", dates[-1])
          print("逐年交易日文件数：", dict(sorted(year_counts.items())))
          print("模型研究区间：2015-01-05 至 2026-09-30")
          if missing:
              raise SystemExit(f"缺少训练、验证或留出集边界交易日：{missing}")
          if dates[0] > required_dates[0] or dates[-1] < required_dates[-1]:
              raise SystemExit("历史行情未覆盖要求的模型研究区间")
          PY

      - name: "检出当前私有策略"
        uses: actions/checkout@v7
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          path: private-strategy
          token: ${{ secrets.AQUANT_PRIVATE_TOKEN }}
          fetch-depth: 1

      - name: "恢复最近兼容研究检查点"
        uses: actions/cache/restore@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/pairwise_rank_compound_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            aquant-research-checkpoints-v1-${{ runner.os }}-

      - name: "记录研究基线"
        run: |
          echo "公开仓库提交: $(git rev-parse HEAD)"
          echo "私有策略提交: $(git -C private-strategy rev-parse HEAD)"
          grep -E '当前版本|模型训练窗口|日常生产' private-strategy/README.md || true

      - name: "执行或恢复高精度严格标签研究"
        run: >-
          python scripts/research_checkpoint_runner.py --key high_precision_profit_mining
          --output data/backtest/high_precision_profit_mining_research_latest.json
          --dependencies scripts/high_precision_profit_mining.py scripts/train_short_term_model.py scripts/short_term_research.py scripts/market_scope.py scripts/selection_factor_catalog.py config/选股条件研究配置.json
          --command python scripts/high_precision_profit_mining.py --start 2015-01-05 --final-end 2026-09-30 --output data/backtest/high_precision_profit_mining_research_latest.json

      - name: "持久化检查点：高精度研究"
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-01-high-precision

      - name: "执行或恢复可执行复利组合评估"
        run: >-
          python scripts/research_checkpoint_runner.py --key high_precision_compound_portfolio
          --output data/backtest/high_precision_compound_portfolio_latest.json
          --inputs data/backtest/high_precision_profit_mining_research_latest.json
          --dependencies scripts/compound_portfolio_backtest.py scripts/high_precision_profit_mining.py scripts/train_short_term_model.py scripts/short_term_research.py scripts/market_scope.py scripts/selection_factor_catalog.py config/选股条件研究配置.json
          --command python scripts/compound_portfolio_backtest.py --model-result data/backtest/high_precision_profit_mining_research_latest.json --output data/backtest/high_precision_compound_portfolio_latest.json

      - name: "比较每日成对排序与分类模型的可执行复利"
        run: >-
          python scripts/pairwise_rank_compound_backtest.py
          --model-result data/backtest/high_precision_profit_mining_research_latest.json
          --output data/backtest/pairwise_rank_compound_latest.json

      - name: "持久化检查点：复利评估"
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-02-compound

      - name: "执行或恢复：单因子与双条件组合挖掘"
        if: ${{ always() }}
        run: python scripts/run_all_conditions_research.py --stage-key single_and_double_condition_rules

      - name: "持久化检查点：单因子与双条件组合挖掘"
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-03-single-double

      - name: "执行或恢复：市场状态与三条件组合挖掘"
        if: ${{ always() }}
        run: python scripts/run_all_conditions_research.py --stage-key market_regime_three_condition_rules

      - name: "持久化检查点：市场状态与三条件组合挖掘"
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-04-market-regime

      - name: "执行或恢复：正式策略评分阈值挖掘"
        if: ${{ always() }}
        run: python scripts/run_all_conditions_research.py --stage-key private_strategy_score_thresholds

      - name: "持久化检查点：正式策略评分阈值挖掘"
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-05-strategy-score

      - name: "执行或恢复：短线净收益百分之一模型训练"
        if: ${{ always() }}
        run: python scripts/run_all_conditions_research.py --stage-key short_term_one_percent_model

      - name: "持久化检查点：短线净收益百分之一模型训练"
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-06-short-term-model

      - name: "执行或恢复：可执行净收益百分之三路径模型训练"
        if: ${{ always() }}
        run: python scripts/run_all_conditions_research.py --stage-key executable_three_percent_path_model

      - name: "持久化检查点：可执行净收益百分之三路径模型训练"
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-07-executable-path-model

      - name: "打包完整条件研究产物"
        if: ${{ always() }}
        run: python scripts/pack_all_condition_results.py

      - name: "执行或恢复路径感知梯度提升研究"
        if: ${{ always() }}
        run: >-
          python scripts/research_checkpoint_runner.py --key path_aware_gbdt
          --output data/backtest/path_aware_gbdt_research_latest.json
          --dependencies scripts/train_path_aware_gbdt.py scripts/train_path_aware_model.py scripts/short_term_research.py scripts/train_short_term_model.py scripts/market_scope.py scripts/selection_factor_catalog.py config/选股条件研究配置.json
          --command python scripts/train_path_aware_gbdt.py --output data/backtest/path_aware_gbdt_research_latest.json

      - name: "持久化检查点：路径感知模型"
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-08-gbdt

      - name: "执行或恢复扩展训练窗口实验：固定阈值"
        if: ${{ always() }}
        run: >-
          python scripts/research_checkpoint_runner.py --key path_aware_gbdt_train2024_fixed078
          --output data/backtest/path_aware_gbdt_train2024_fixed078.json
          --dependencies scripts/train_path_aware_gbdt.py scripts/train_path_aware_model.py scripts/short_term_research.py scripts/train_short_term_model.py scripts/market_scope.py scripts/selection_factor_catalog.py config/选股条件研究配置.json
          --command python scripts/train_path_aware_gbdt.py --train-end 2024-12-31 --validation-start 2025-01-02 --validation-end 2025-12-31 --final-start 2026-01-05 --final-end 2026-09-30 --fixed-threshold 0.78 --output data/backtest/path_aware_gbdt_train2024_fixed078.json

      - name: "持久化检查点：扩展训练窗口实验"
        if: ${{ always() }}
        uses: actions/cache/save@v4
        with:
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
            data/research/workflow_stages/
            data/research/all_conditions/
          key: aquant-research-checkpoints-v1-${{ runner.os }}-${{ github.run_id }}-${{ github.run_attempt }}-09-gbdt-fixed078

      - name: "汇总研究结果"
        if: ${{ always() }}
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          paths = [
              Path("data/backtest/high_precision_profit_mining_research_latest.json"),
              Path("data/backtest/high_precision_compound_portfolio_latest.json"),
              Path("data/backtest/pairwise_rank_compound_latest.json"),
              Path("data/backtest/path_rule_mining_research_latest.json"),
              Path("data/backtest/path_regime_rule_mining_research_latest.json"),
              Path("data/backtest/strict_path_strategy_score_mining_research_latest.json"),
              Path("data/backtest/feature_training_research_latest.json"),
              Path("data/backtest/executable_path_profit_training_research_latest.json"),
              Path("data/backtest/all_conditions_research_manifest_latest.json"),
              Path("data/backtest/path_aware_gbdt_research_latest.json"),
              Path("data/backtest/path_aware_gbdt_train2024_fixed078.json"),
          ]
          for path in paths:
              if not path.exists():
                  print(f"未生成研究结果: {path}")
                  continue
              data = json.loads(path.read_text(encoding="utf-8"))
              print(f"===== {path.name} =====")
              for key in (
                  "status",
                  "selected_validation_operating_point",
                  "selected_final_operating_point",
                  "validation",
                  "final",
              ):
                  if key in data:
                      print(json.dumps({key: data[key]}, ensure_ascii=False, indent=2))
          PY

      - name: "保存研究产物"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: "短线模型研究结果"
          path: |
            data/backtest/high_precision_profit_mining_research_latest.json
            data/backtest/high_precision_compound_portfolio_latest.json
            data/backtest/path_rule_mining_research_latest.json
            data/backtest/path_regime_rule_mining_research_latest.json
            data/backtest/strict_path_strategy_score_mining_research_latest.json
            data/backtest/feature_training_research_latest.json
            data/backtest/executable_path_profit_training_research_latest.json
            data/backtest/all_conditions_research_manifest_latest.json
            data/research/all_conditions/**
            data/research/workflow_stages/**
            data/backtest/path_aware_gbdt_research_latest.json
            data/backtest/path_aware_gbdt_train2024_fixed078.json
          if-no-files-found: warn
          retention-days: 30
