name: Quality Gate

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -q

  changelog-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Require changelog
        shell: bash
        run: |
          git diff --name-only "origin/${{ github.base_ref }}" HEAD > /tmp/changed.txt
          if grep -E '^(app|components|scripts|tests|src|package\.json|tsconfig\.json|next\.config|vercel\.json|\.github/workflows)/' /tmp/changed.txt >/dev/null; then
            if ! grep '^CHANGELOG.md$' /tmp/changed.txt >/dev/null; then
              echo "Code changes detected without CHANGELOG.md update."
              exit 1
            fi
          fi
