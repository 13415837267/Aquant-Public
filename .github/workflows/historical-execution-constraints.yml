name: Historical Execution Constraints

on:
  push:
    paths:
      - "scripts/backtest_constrained.py"
      - ".github/workflows/historical-execution-constraints.yml"
  workflow_dispatch:
    inputs:
      start:
        description: "Signal start date"
        required: true
        default: "2015-01-05"
      end:
        description: "Signal end date"
        required: true
        default: "2026-09-29"
      top_n:
        description: "Equal-weight portfolio size"
        required: true
        default: "30"
      cost_bps:
        description: "Transaction cost (bps)"
        required: true
        default: "3"
      slippage_bps:
        description: "Slippage (bps)"
        required: true
        default: "2"
      turnover_cap:
        description: "Daily turnover cap"
        required: true
        default: "0.30"

permissions:
  contents: write

concurrency:
  group: historical-execution-constraints
  cancel-in-progress: true

jobs:
  constrained:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout public repository
        uses: actions/checkout@v6

      - name: Checkout private strategy
        uses: actions/checkout@v6
        with:
          repository: 13415837267/Aquant-Private
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Resolve strategy commit
        id: strategy
        shell: bash
        run: |
          echo "commit=$(git -C .private-strategy rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run constrained historical backtest
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
          AQUANT_PRIVATE_STRATEGY_COMMIT: ${{ steps.strategy.outputs.commit }}
        run: |
          python scripts/backtest_constrained.py \
            --start "${{ inputs.start || '2015-01-05' }}" \
            --end "${{ inputs.end || '2026-09-29' }}" \
            --top-n "${{ inputs.top_n || '30' }}" \
            --cost-bps "${{ inputs.cost_bps || '3' }}" \
            --slippage-bps "${{ inputs.slippage_bps || '2' }}" \
            --turnover-cap "${{ inputs.turnover_cap || '0.30' }}" \
            --output data/backtest/execution_constrained.json

      - name: Compare baseline and constrained
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("data/backtest")
          baseline = json.loads((root / "latest.json").read_text(encoding="utf-8"))
          constrained = json.loads((root / "execution_constrained.json").read_text(encoding="utf-8"))

          fields = [
              "total_return_pct",
              "annualized_return_pct",
              "annualized_volatility_pct",
              "sharpe",
              "max_drawdown_pct",
              "win_rate_pct",
              "average_turnover_pct",
              "total_turnover_pct",
          ]
          b = baseline["overall"]
          c = constrained["overall"]
          u = constrained["flattened_unconstrained"]["overall"]

          def diff(left, right):
              return {
                  k: (
                      float(left[k]) - float(right[k])
                      if left.get(k) is not None and right.get(k) is not None
                      else None
                  )
                  for k in fields
              }

          comparison = {
              "schema_version": 2,
              "status": "ready",
              "comparison_note": (
                  "The primary execution-constraint comparison is stateful constrained "
                  "vs stateful unconstrained, using identical PIT signals and accounting. "
                  "The production baseline remains separately recorded; its return definition "
                  "is independent T+1 open-to-close replay."
              ),
              "baseline_strategy_commit": baseline["strategy_commit"],
              "constrained_strategy_commit": constrained["strategy_commit"],
              "baseline_production": {k: b.get(k) for k in fields},
              "stateful_unconstrained": {k: u.get(k) for k in fields},
              "stateful_constrained": {k: c.get(k) for k in fields},
              "limit_constraint_impact": diff(c, u),
              "constrained_intraday_metrics": constrained.get("intraday_metrics", {}),
              "execution_audit": constrained.get("audit", {}),
          }
          if comparison["baseline_strategy_commit"] != comparison["constrained_strategy_commit"]:
              raise SystemExit("strategy commit mismatch between baseline and constrained runs")
          if constrained.get("future_function") is not False:
              raise SystemExit("constrained run failed PIT audit")
          (root / "execution_comparison.json").write_text(
              json.dumps(comparison, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(comparison["limit_constraint_impact"], ensure_ascii=False))
          PY

      - name: Commit constrained results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/execution_constrained.json data/backtest/execution_comparison.json
          if git diff --cached --quiet; then
            echo "No constrained backtest result changes."
            exit 0
          fi
          git commit -m "research: update execution constrained backtest"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          echo "Failed to push constrained backtest after 3 attempts." >&2
          exit 1
