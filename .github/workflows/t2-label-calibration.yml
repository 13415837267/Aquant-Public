name: T2标签模型重新校准
on:
  workflow_dispatch:
jobs:
  calibrate:
    runs-on: ubuntu-latest
    steps:
      - name: 检出研究分支
        uses: actions/checkout@v4
        with:
          ref: research/t2-label-calibration
          fetch-depth: 1
      - name: 设置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: |
          python -m pip install -r requirements.txt
      - name: 重新训练T+2标签模型
        run: |
          python scripts/high_precision_profit_mining.py
      - name: 输出模型参数
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path("data/backtest/high_precision_profit_mining_latest.json").read_text(encoding="utf-8"))
          print(json.dumps({"model": d["model"], "selected_validation_operating_point": d["selected_validation_operating_point"], "selected_final_operating_point": d["final"]["selected_threshold"]}, ensure_ascii=False, indent=2))
          PY
