name: 可兑现路径研究训练

on:
  push:
    branches:
      - main
    paths:
      - "scripts/train_executable_path_model.py"
      - "scripts/short_term_research.py"
      - ".github/workflows/04-executable-path-training.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  train:
    name: 云端可兑现路径训练
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: 检出主分支
        uses: actions/checkout@v4
      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install numpy pandas
          fi
      - name: 执行可兑现路径训练
        run: |
          mkdir -p data/backtest
          python scripts/train_executable_path_model.py
      - name: 检查训练结果
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path("data/backtest/executable_path_profit_training_latest.json").read_text(encoding="utf-8"))
          assert result["status"] == "research_only"
          assert result["audit"]["no_future_features"] is True
          assert result["audit"]["formal_production_changed"] is False
          assert result["audit"]["t_plus_1_target_not_counted_as_win"] is True
          assert result["audit"]["sellable_win_starts_t_plus_2"] is True
          assert result["train"]["samples"] >= 5000
          print("可兑现路径训练产物检查通过")
          print(json.dumps({
            "训练样本": result["train"]["samples"],
            "验证样本": result["validation"]["samples"],
            "最终留出样本": result["final"]["samples"]
          }, ensure_ascii=False, indent=2))
          PY
      - name: 保存训练产物
        uses: actions/upload-artifact@v4
        with:
          name: 可兑现路径训练结果
          path: data/backtest/executable_path_profit_training_latest.json
          retention-days: 14
