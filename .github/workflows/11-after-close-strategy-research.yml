name: "11 盘后选股策略统一研究"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/11-after-close-strategy-research.yml"
      - "scripts/after_close_strategy_report.py"
      - "scripts/path_rule_mining.py"
      - "scripts/after_close_rule_compound_backtest.py"
      - "scripts/after_close_factor_ablation.py"
      - "tests/test_after_close_factor_ablation.py"
      - "docs/盘后选股统一组合研究.md"
      - "README.md"
      - "scripts/path_aware_gbdt_compound_backtest.py"
      - "scripts/compound_portfolio_backtest.py"
      - "scripts/train_path_aware_gbdt.py"
      - "scripts/train_short_term_model.py"
      - "scripts/short_term_research.py"
      - "scripts/selection_factor_catalog.py"
      - "config/选股条件研究配置.json"
      - "tests/test_after_close_strategy_report.py"
      - "tests/test_after_close_rule_compound_backtest.py"
      - "tests/test_workflow_action_runtimes.py"
      - "tests/test_path_rule_mining.py"

permissions:
  actions: read
  contents: read

concurrency:
  group: "盘后选股策略统一研究-main-v2"
  # 研究作业可能运行数小时；新提交不得取消正在进行的云端实验。
  cancel-in-progress: false

jobs:
  quality:
    name: "研究前质量与口径检查"
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: "检出代码与历史行情"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置 Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "安装固定研究依赖"
        run: python -m pip install -r requirements.txt

      - name: "检查语法与完整测试"
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m pytest -q

      - name: "核验历史区间与标签契约"
        run: |
          set -euo pipefail
          python - <<'PY'
          from scripts.short_term_research import history_files
          from scripts.selection_factor_catalog import load_research_config

          files = history_files()
          dates = {path.name[:10] for path in files}
          required = (
              "2015-01-05",
              "2022-12-30",
              "2023-01-03",
              "2024-12-31",
              "2025-01-02",
              "2026-09-30",
          )
          missing = [date for date in required if date not in dates]
          if missing:
              raise SystemExit(f"历史行情缺少必要边界：{missing}")
          config = load_research_config()
          assert float(config["短线目标净收益百分比"]) == 1.0
          assert float(config["止损幅度百分比"]) == 3.0
          assert float(config["往返交易成本基点"]) == 10.0
          assert int(config["最大前瞻交易日数"]) == 5
          assert int(config["最早允许退出日序号"]) == 2
          assert config["开盘涨停禁止入场"] is True
          print("历史行情文件数：", len(files))
          print("历史数据范围：", min(dates), "至", max(dates))
          print("统一目标：净收益 +1% 先于 -3% 止损，T+1 开盘入场，T+2 起允许退出")
          print("交易成本基准：往返 10 bps；正式生产策略保持不变")
          PY

  rule_strategy:
    name: "盘后可解释条件挖掘"
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: "检出代码与历史行情"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置 Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "安装固定研究依赖"
        run: python -m pip install -r requirements.txt

      - name: "发现期挖掘、验证期冻结、最终期补充复核"
        run: |
          set -euo pipefail
          mkdir -p data/backtest
          python scripts/path_rule_mining.py \
            --start 2015-01-05 \
            --final-end 2026-09-30 \
            --output data/backtest/after_close_rule_mining.json

      - name: "保存规则研究结果"
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: "rule-research"
          path: data/backtest/after_close_rule_mining.json
          if-no-files-found: error
          retention-days: 30

  rule_portfolio_strategy:
    name: "训练期冻结规则的现金约束组合回测"
    needs: rule_strategy
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: "检出公开仓库代码与历史行情"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置 Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "安装固定研究依赖"
        run: python -m pip install -r requirements.txt

      - name: "下载训练期规则挖掘结果"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/artifacts/rules
          gh run download "$GITHUB_RUN_ID" --name "rule-research" --dir data/artifacts/rules

      - name: "按冻结规则运行同口径Top2组合回测"
        run: |
          set -euo pipefail
          mkdir -p data/backtest
          python scripts/after_close_rule_compound_backtest.py \
            --rules data/artifacts/rules/after_close_rule_mining.json \
            --output data/backtest/after_close_rule_compound.json

      - name: "保存规则组合回测结果"
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: "rule-portfolio"
          path: data/backtest/after_close_rule_compound.json
          if-no-files-found: error
          retention-days: 30

  model_strategy:
    name: "模型筛选与现金约束组合回测"
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: "检出代码与历史行情"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置 Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "安装固定研究依赖"
        run: python -m pip install -r requirements.txt

      - name: "训练路径感知模型并按验证集复利选阈值"
        run: |
          set -euo pipefail
          mkdir -p data/backtest
          python scripts/path_aware_gbdt_compound_backtest.py \
            --output data/backtest/after_close_model_compound.json

      - name: "保存模型组合结果"
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: "model-compound"
          path: data/backtest/after_close_model_compound.json
          if-no-files-found: error
          retention-days: 30

  factor_ablation:
    name: "单因子消融现金约束组合回测"
    needs:
      - quality
      - rule_strategy
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: "1"
    steps:
      - name: "检出代码与历史行情"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置 Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "安装固定研究依赖"
        run: python -m pip install -r requirements.txt

      - name: "下载发现期规则研究结果"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/artifacts/rules
          gh run download "$GITHUB_RUN_ID" --name "rule-research" --dir data/artifacts/rules

      - name: "运行 ATR振幅、隔夜收益、市场广度匹配消融"
        run: |
          set -euo pipefail
          mkdir -p data/backtest
          python scripts/after_close_factor_ablation.py \
            --rules data/artifacts/rules/after_close_rule_mining.json \
            --output data/backtest/after_close_factor_ablation.json

      - name: "保存单因子消融结果"
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: "factor-ablation"
          path: data/backtest/after_close_factor_ablation.json
          if-no-files-found: error
          retention-days: 30

  comparison_report:
    name: "生成统一研究结论与晋级审计"
    if: ${{ always() }}
    needs:
      - rule_strategy
      - rule_portfolio_strategy
      - model_strategy
      - factor_ablation
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: "核验上游研究作业状态"
        env:
          RULE_RESEARCH_RESULT: ${{ needs.rule_strategy.result }}
          RULE_PORTFOLIO_RESULT: ${{ needs.rule_portfolio_strategy.result }}
          MODEL_RESEARCH_RESULT: ${{ needs.model_strategy.result }}
          FACTOR_ABLATION_RESULT: ${{ needs.factor_ablation.result }}
        run: |
          set -euo pipefail
          printf "规则挖掘：%s\n" "$RULE_RESEARCH_RESULT"
          printf "规则组合回测：%s\n" "$RULE_PORTFOLIO_RESULT"
          printf "模型组合回测：%s\n" "$MODEL_RESEARCH_RESULT"
          printf "因子消融：%s\n" "$FACTOR_ABLATION_RESULT"
          if [[ "$RULE_RESEARCH_RESULT" != "success" || "$RULE_PORTFOLIO_RESULT" != "success" || "$MODEL_RESEARCH_RESULT" != "success" || "$FACTOR_ABLATION_RESULT" != "success" ]]; then
            {
              echo "## 统一研究结论未生成"
              echo
              echo "上游作业至少一项未成功；为避免缺失工件或混合版本，停止生成模型/规则比较报告。"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "上游研究作业全部成功，开始生成同口径研究对照。" >> "$GITHUB_STEP_SUMMARY"

      - name: "检出报告脚本"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            scripts/after_close_strategy_report.py

      - name: "设置 Python 3.11"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: "下载规则研究与模型组合产物"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/artifacts/rules
          gh run download "$GITHUB_RUN_ID" --name "rule-research" --dir data/artifacts/rules

      - name: "下载模型组合产物"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/artifacts/model
          gh run download "$GITHUB_RUN_ID" --name "model-compound" --dir data/artifacts/model

      - name: "下载规则组合回测产物"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/artifacts/rule-portfolio
          gh run download "$GITHUB_RUN_ID" --name "rule-portfolio" --dir data/artifacts/rule-portfolio

      - name: "下载单因子消融结果"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p data/artifacts/factor-ablation
          gh run download "$GITHUB_RUN_ID" --name "factor-ablation" --dir data/artifacts/factor-ablation

      - name: "将单因子消融结果写入运行摘要"
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("data/artifacts/factor-ablation/after_close_factor_ablation.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          print("## 单因子消融结果")
          print()
          print("| 因子族 | 验证期：移除因子复利 | 验证期：保留因子复利 | 验证期：复利差 | 补充期：移除因子复利 | 补充期：保留因子复利 | 补充期：复利差 |")
          print("|---|---:|---:|---:|---:|---:|---:|")
          for family, item in data.get("families", {}).items():
              variants = item.get("variants", {})
              without = variants.get("ablation", {})
              with_factor = variants.get("with_factor", {})
              v_without = (without.get("validation") or {}).get("compound_return_pct")
              v_with = (with_factor.get("validation") or {}).get("compound_return_pct")
              f_without = (without.get("final_supplemental") or {}).get("compound_return_pct")
              f_with = (with_factor.get("final_supplemental") or {}).get("compound_return_pct")
              dv = None if v_without is None or v_with is None else v_with - v_without
              df = None if f_without is None or f_with is None else f_with - f_without
              def fmt(value):
                  return "无候选" if value is None else f"{value:.2f}%"
              print(f"| {family} | {fmt(v_without)} | {fmt(v_with)} | {fmt(dv)} | {fmt(f_without)} | {fmt(f_with)} | {fmt(df)} |")
          print()
          print("规则只由训练期挑选；最终补充期不是全新留出。结果仅供研究，不自动修改生产。")
          PY

      - name: "汇总规则、实际组合收益与研究门槛"
        run: |
          set -euo pipefail
          python scripts/after_close_strategy_report.py \
            --rules data/artifacts/rules/after_close_rule_mining.json \
            --model data/artifacts/model/after_close_model_compound.json \
            --rule-portfolio data/artifacts/rule-portfolio/after_close_rule_compound.json \
            --output data/backtest/after_close_strategy_comparison_latest.json

      - name: "保存统一对照报告"
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: "after-close-strategy-comparison"
          path: data/backtest/after_close_strategy_comparison_latest.json
          if-no-files-found: error
          retention-days: 30
