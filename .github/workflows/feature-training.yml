name: 全市场特征训练

on:
  push:
    branches: [main]
    paths:
      - "scripts/train_short_term_model.py"
      - "requirements.txt"
      - ".github/workflows/feature-training.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: full-market-feature-training-main
  cancel-in-progress: false

jobs:
  train:
    name: 全市场特征训练
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v6
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 初始化运行进度
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runtime
          echo "{\"timestamp_utc\":\"$(date -u +%FT%TZ)\",\"event\":\"feature_training_started\",\"run_id\":\"${GITHUB_RUN_ID}\"}" > runtime/feature_training_progress.jsonl
      - name: Python 质量检查
        run: python -m pytest -q
      - name: 训练并验证 2015 年至今全市场历史
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/train_short_term_model.py --start 2015-01-05 --final-end 2026-09-30
          echo "{\"timestamp_utc\":\"$(date -u +%FT%TZ)\",\"event\":\"feature_training_completed\"}" >> runtime/feature_training_progress.jsonl
      - name: 上传研究产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-market-feature-training
          path: |
            data/backtest/feature_training_latest.json
            runtime/feature_training_progress.jsonl
          retention-days: 30
      - name: 提交研究结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/feature_training_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record full-market feature training"
          git push origin HEAD:main
