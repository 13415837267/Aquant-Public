name: Short-Term Signal Variant Research

on:
  push:
    branches: [main]
    paths:
      - "scripts/short_term_variant_research.py"
      - ".github/workflows/short-term-variant-research.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: short-term-variant-research
  cancel-in-progress: false

jobs:
  variant-research:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run variant comparison
        run: python scripts/short_term_variant_research.py --start 2021-01-05 --end 2026-09-21 --output data/backtest/short_term_variants.json
      - name: Validate artifact
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("data/backtest/short_term_variants.json")
          x=json.loads(p.read_text())
          if x.get("status")!="ready" or x.get("notes",{}).get("future_function") is not False:
              raise SystemExit("variant research artifact is not ready/PIT-clean")
          if len(x.get("variants",[])) < 5:
              raise SystemExit("expected at least five variants")
          print("validated", len(x["variants"]), "variants")
          PY
      - name: Commit variant research output
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/short_term_variants.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: compare short-term signal variants"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
