name: Python质量检查

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - "config/**"
      - ".github/workflows/**"

permissions:
  contents: read

concurrency:
  group: python-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python质量检查
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v6
      - name: 设置Python环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 编译Python
        run: python -m compileall -q scripts tests
      - name: 运行测试
        run: pytest -q
