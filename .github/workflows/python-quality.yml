name: 程序质量检查

on:
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-quality.yml"
  pull_request:
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/python-quality.yml"

concurrency:
  group: python-quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Python 质量检查
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v6
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 编译 Python
        run: python -m compileall -q scripts tests
      - name: 运行测试
        run: pytest -q
