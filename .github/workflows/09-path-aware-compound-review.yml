name: "09 路径感知模型可执行复利复核"

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/09-path-aware-compound-review.yml"
      - "scripts/path_aware_gbdt_compound_backtest.py"
      - "scripts/compound_portfolio_backtest.py"
      - "tests/test_path_aware_gbdt_compound_backtest.py"

permissions:
  contents: read

concurrency:
  group: "路径感知可执行复利复核-main-v1"
  cancel-in-progress: false

jobs:
  review:
    name: "云端验证集阈值复利筛选"
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置Python环境"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装研究依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "研究脚本质量检查"
        run: |
          set -euo pipefail
          python -m compileall -q scripts tests
          python -m pytest -q

      - name: "检查历史数据与退出窗口覆盖"
        run: |
          python - <<'PY'
          from scripts.path_aware_gbdt_compound_backtest import complete_signal_window_end
          from scripts.short_term_research import history_files
          from scripts.train_path_aware_gbdt import (
              FINAL_END,
              FINAL_START,
              MAX_FORWARD_SESSIONS,
              TRAIN_END,
              VALIDATION_END,
              VALIDATION_START,
          )

          files = history_files()
          dates = [path.name[:10] for path in files]
          required = (TRAIN_END, VALIDATION_START, VALIDATION_END, FINAL_START, FINAL_END)
          missing = [date for date in required if date not in set(dates)]
          if missing:
              raise SystemExit(f"历史行情缺少必要边界交易日：{missing}")
          final_signal_end = complete_signal_window_end(dates, FINAL_END, MAX_FORWARD_SESSIONS)
          if dates.index(final_signal_end) < dates.index(FINAL_START):
              raise SystemExit("历史行情不足以覆盖最终留出区间内至少一个完整退出窗口")
          print("历史数据范围：", dates[0], "至", dates[-1])
          print("历史行情文件数：", len(files))
          print("训练截止日：", TRAIN_END)
          print("验证窗口：", VALIDATION_START, "至", VALIDATION_END)
          print("最终留出名义窗口：", FINAL_START, "至", FINAL_END)
          print("最终留出实际信号窗口：", FINAL_START, "至", final_signal_end)
          print("实际信号截止日之后的完整退出窗口覆盖：通过")
          PY

      - name: "执行验证集阈值筛选与单次留出复核"
        run: |
          set -euo pipefail
          python scripts/path_aware_gbdt_compound_backtest.py \
            --output data/backtest/path_aware_gbdt_compound_latest.json

      - name: "上传定向复核结果"
        if: ${{ always() }}
        uses: actions/upload-artifact@v6
        with:
          name: "路径感知模型可执行复利复核-${{ github.run_id }}"
          path: data/backtest/path_aware_gbdt_compound_latest.json
          if-no-files-found: warn
          retention-days: 30
