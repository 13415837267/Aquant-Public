name: Finalize Historical Database Metadata

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Reconcile metadata
        run: python scripts/reconcile_history_metadata.py
      - name: Commit metadata
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aquant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history/_BACKFILL_STATE.json data/history/_BACKFILL_COMPLETE
          if git diff --cached --quiet; then
            echo "No metadata changes"
            exit 0
          fi
          git commit -m "data: reconcile historical database metadata"
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
