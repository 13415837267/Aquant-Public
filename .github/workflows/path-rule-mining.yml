name: 路径条件规则挖掘

on:
  push:
    branches: [main]
    paths:
      - "scripts/path_rule_mining.py"
      - "scripts/short_term_research.py"
      - "requirements.txt"
      - ".github/workflows/path-rule-mining.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: path-rule-mining-main
  cancel-in-progress: false

jobs:
  mine:
    name: 路径条件规则挖掘
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: 检出公开仓库
        uses: actions/checkout@v6
      - name: 设置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: Python 质量检查
        run: python -m pytest -q
      - name: 运行路径感知条件规则挖掘
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/path_rule_mining.py --start 2015-01-05 --final-end 2026-09-30
      - name: 上传研究产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: path-rule-mining
          path: data/backtest/path_rule_mining_latest.json
          retention-days: 30
      - name: 提交研究结果
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/backtest/path_rule_mining_latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: record path-aware rule mining"
          git push origin HEAD:main
