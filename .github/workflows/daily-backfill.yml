name: Daily Market Data Update

on:
  schedule:
    # 18:00 Beijing time = 10:00 UTC.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Update current year
        env:
          ZZSHARE_TOKEN: '${{ secrets.ZZSHARE_TOKEN }}'
        run: python scripts/backfill_year.py --year $(date +%Y)

      - name: Refresh main-board universe
        env:
          ZZSHARE_TOKEN: '${{ secrets.ZZSHARE_TOKEN }}'
        run: python scripts/refresh_universe.py

      - name: Checkout private strategy
        uses: actions/checkout@v5
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy

      - name: Generate candidates
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
        run: python scripts/update_candidates.py

      - name: Validate candidate pool
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
        run: python scripts/validate_candidates.py

      - name: Archive candidate pool
        run: python scripts/archive_candidates.py

      - name: Validate candidate pool
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path("data/candidates.json").read_text(encoding="utf-8"))
          if payload.get("status") != "ready":
              raise SystemExit("candidate snapshot is not ready")
          if payload.get("future_function") is not False:
              raise SystemExit("candidate PIT audit failed")
          print("CANDIDATE POOL AUDIT PASS")
          PY

      - name: Publish candidate snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aquant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/candidates_history/ data/universe.json
          if git diff --cached --quiet; then
            echo "Candidate snapshot unchanged"
            exit 0
          fi
          git commit -m "data: update candidate snapshot"
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1
