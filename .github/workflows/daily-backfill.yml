name: 每日行情数据更新

on:
  schedule:
    # Check every calendar day at 18:00 Beijing time; continue only when
    # the China A-share trade calendar says today is open.
    - cron: "0 10 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-market-data-update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check China A-share trading day
        id: market
        env:
          ZZSHARE_TOKEN: '${{ secrets.ZZSHARE_TOKEN }}'
        run: |
          set -euo pipefail
          result="$(python scripts/check_trading_day.py)"
          printf '%s\n' "$result"
          is_trading_day="$(printf '%s\n' "$result" | awk -F= '/^IS_TRADING_DAY=/{print $2}')"
          if [[ "$is_trading_day" != "true" && "$is_trading_day" != "false" ]]; then
            echo "Invalid trading-day result: $is_trading_day"
            exit 1
          fi
          echo "is_trading_day=$is_trading_day" >> "$GITHUB_OUTPUT"

      - name: Update current year
        if: steps.market.outputs.is_trading_day == 'true'
        env:
          ZZSHARE_TOKEN: '${{ secrets.ZZSHARE_TOKEN }}'
        run: python scripts/backfill_year.py --year $(date +%Y)

      - name: Refresh main-board universe
        if: steps.market.outputs.is_trading_day == 'true'
        env:
          ZZSHARE_TOKEN: '${{ secrets.ZZSHARE_TOKEN }}'
        run: python scripts/refresh_universe.py

      - name: Checkout private strategy
        if: steps.market.outputs.is_trading_day == 'true'
        uses: actions/checkout@v5
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: .private-strategy

      - name: Generate candidates
        if: steps.market.outputs.is_trading_day == 'true'
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
        run: python scripts/update_candidates.py

      - name: Validate candidate pool
        if: steps.market.outputs.is_trading_day == 'true'
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/.private-strategy
        run: python scripts/validate_candidates.py

      - name: Archive candidate pool
        if: steps.market.outputs.is_trading_day == 'true'
        run: python scripts/archive_candidates.py

      - name: Publish candidate snapshot
        if: steps.market.outputs.is_trading_day == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "aquant-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/candidates_history/ data/universe.json
          if git diff --cached --quiet; then
            echo "Candidate snapshot unchanged"
            exit 0
          fi
          git commit -m "data: update candidate snapshot"
          git fetch origin main
          git rebase origin/main
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi
            git fetch origin main
            git rebase origin/main
          done
          exit 1

      - name: Non-trading day
        if: steps.market.outputs.is_trading_day == 'false'
        run: echo "China A-share market is closed today; data update skipped."
