name: "07 第一版模型资产物化"

on:
  push:
    paths:
      - "data/research/model_bootstrap_trigger.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "模型资产物化-main"
  cancel-in-progress: false

jobs:
  materialize:
    name: "云端物化固定模型权重"
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装Python依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "云端一次性物化第一版模型"
        run: |
          set -euo pipefail
          python scripts/materialize_production_model.py --start 2019-01-02 --end 2026-09-30 --output data/models/production_v1.json

      - name: "验证固定模型资产"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("config/production_release_v1.json").read_text(encoding="utf-8"))
          model = json.loads(Path("data/models/production_v1.json").read_text(encoding="utf-8"))
          baseline = release["model_baseline"]
          assert model["status"] == "active_baseline"
          assert model["strategy_version"] == baseline["version"]
          assert model["model_code_commit"] == baseline["model_code_commit"]
          assert model["training_start"] == baseline["training_start"]
          assert model["training_end"] == baseline["training_end"]
          assert model["data_cutoff"] == baseline["data_cutoff"]
          print("第一版固定模型资产验证通过。")
          PY

      - name: "提交模型资产"
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/models/production_v1.json
          git commit -m "模型：物化第一版固定模型权重"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
