name: "01 Python质量检查"

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: "Python语法与测试"
    runs-on: ubuntu-latest
    steps:
      - name: "检出代码"
        uses: actions/checkout@v7

      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装Python依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "检查Python语法"
        run: python -m compileall -q scripts tests

      - name: "运行Python测试"
        run: python -m pytest -q
