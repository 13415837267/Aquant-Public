name: "01 Python质量检查"

on:
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches:
      - main
    paths:
      - "scripts/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "python-quality-main"
  cancel-in-progress: true

jobs:
  quality:
    name: "Python语法与测试"
    runs-on: ubuntu-24.04
    steps:
      - name: "检出代码"
        uses: actions/checkout@v7

      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装Python依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "检查Python语法"
        run: python -m compileall -q scripts tests

      - name: "运行Python测试"
        run: python -m pytest -q
