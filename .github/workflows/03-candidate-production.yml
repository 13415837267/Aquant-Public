name: "03 候选池生产"

env:
  GIT_CONFIG_COUNT: "1"
  GIT_CONFIG_KEY_0: "init.defaultBranch"
  GIT_CONFIG_VALUE_0: "main"

on:
  push:
    branches: [main]
    paths:
      - "scripts/production_model.py"
      - "scripts/generate_research_candidates.py"
      - "scripts/next_trading_day_plan.py"
      - "config/system_version.json"
      - "config/production_release_v1.json"
      - "data/models/production_v1.json"
  workflow_run:
    workflows: ["02 数据维护"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      signal_date:
        description: "可选：指定本次候选信号日期（北京时间18:00截面）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: "候选生产-main"
  cancel-in-progress: false

jobs:
  gate:
    name: "交易日与快照日期门禁"
    runs-on: ubuntu-24.04
    outputs:
      is_trading_day: ${{ steps.check.outputs.is_trading_day }}
    steps:
      - name: "检出代码"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "验证上游状态与候选日期"
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -n "${{ inputs.signal_date }}" ]; then
            echo "手动指定了信号日期，按请求日期执行候选回放式生产。"
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$EVENT_NAME" = "workflow_run" ] && [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "上游数据维护未成功，禁止生成正式候选快照。" >&2
            exit 1
          fi
          # 代码变更、无日期手动运行和成功的数据维护事件统一进入下方门禁：
          # 状态日期必须为今日、最新历史行情必须覆盖今日，否则绝不发布旧候选。

          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          status_path = Path("data/trading_day_status.json")
          candidates_path = Path("data/candidates.json")
          if not status_path.exists():
              raise SystemExit("缺少交易日状态文件，禁止使用旧状态生成候选。")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          checked_at = datetime.fromisoformat(status["checked_at"])
          if checked_at.tzinfo is None:
              raise SystemExit("交易日状态时间缺少时区，禁止生成候选。")
          checked_date = checked_at.astimezone(tz).date()

          reason = ""
          eligible = False
          today = now.date().isoformat()
          history_dates = sorted(
              path.name[:10]
              for path in Path("data/history").glob("*/*.csv.gz")
              if len(path.name) >= 10
              and path.name[4:5] == "-"
              and path.name[7:8] == "-"
          )
          latest_history_date = history_dates[-1] if history_dates else ""
          if checked_date != now.date():
              reason = f"交易日状态不是今日检查结果（状态日期={checked_date}，当前日期={now.date()}），等待下一次补跑。"
          elif not bool(status.get("is_trading_day")):
              reason = "上游状态明确标记为非交易日，本次不生成新候选。"
          elif latest_history_date != today:
              reason = f"历史行情尚未覆盖今日（最新历史日期={latest_history_date or '无'}，今日={today}），禁止生成旧日期候选。"
          else:
              candidates = json.loads(candidates_path.read_text(encoding="utf-8")) if candidates_path.exists() else {}
              as_of = str(candidates.get("as_of", ""))
              candidate_date = as_of[:10]
              if candidate_date >= today:
                  reason = f"正式候选快照已覆盖今日（候选日期={candidate_date}），跳过重复生产。"
              else:
                  eligible = True
                  reason = f"今日行情已落库，当前正式候选日期={candidate_date}，允许生成最新候选。"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_trading_day={str(eligible).lower()}\n")
          print(reason)
          PY

  produce:
    name: "按正式基准生成候选池与下一交易日计划"
    needs: gate
    if: ${{ needs.gate.outputs.is_trading_day == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "检出固定Private策略用于审计"
        uses: actions/checkout@v7
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          path: private-strategy
          token: ${{ secrets.AQUANT_PRIVATE_TOKEN }}
          fetch-depth: 1

      - name: "验证系统与策略版本一一对应"
        run: |
          set -euo pipefail
          ACTUAL_PRIVATE_COMMIT="$(git -C private-strategy rev-parse HEAD)"
          EXPECTED_PRIVATE_COMMIT="$(python -c 'import json; print(json.load(open("config/system_version.json", encoding="utf-8"))["strategy_commit"])')"
          ACTUAL_PRIVATE_VERSION="$(grep '^STRATEGY_VERSION' private-strategy/strategy/version.py | cut -d '"' -f 2)"
          EXPECTED_SYSTEM_VERSION="$(python -c 'import json; print(json.load(open("config/system_version.json", encoding="utf-8"))["system_version"])')"
          EXPECTED_STRATEGY_VERSION="$(python -c 'import json; print(json.load(open("config/system_version.json", encoding="utf-8"))["strategy_version"])')"
          echo "Private/main 提交：$ACTUAL_PRIVATE_COMMIT"
          echo "当前系统版本：$EXPECTED_SYSTEM_VERSION；策略版本：$ACTUAL_PRIVATE_VERSION"
          test "$ACTUAL_PRIVATE_COMMIT" = "$EXPECTED_PRIVATE_COMMIT"
          test "$ACTUAL_PRIVATE_VERSION" = "$EXPECTED_SYSTEM_VERSION"
          test "$ACTUAL_PRIVATE_VERSION" = "$EXPECTED_STRATEGY_VERSION"
          grep -q 'release_status: "research_only"' private-strategy/config/strategy.yaml

      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装Python依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "归档上一交易日候选池"
        run: |
          if [ -f data/candidates.json ] && grep -q '"status": "ready"' data/candidates.json; then
            python scripts/archive_candidates.py
          else
            echo "当前候选快照不是可归档的 ready 状态，跳过归档。"
          fi

      - name: "确认旧神经网络仅作历史对照"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path("config/system_version.json").read_text(encoding="utf-8"))
          archived = json.loads(Path("data/models/production_v1.json").read_text(encoding="utf-8"))
          assert manifest["system_version"] == manifest["strategy_version"] == "2.6.0"
          assert manifest["lifecycle_status"] == "research"
          assert manifest["production_release"] is False
          assert manifest["automatic_ordering"] is False
          assert archived["status"] == "archived_research_baseline"
          print("旧神经网络已归档；当前运行将直接加载 Private/main 研究策略，不使用旧权重。")
          PY

      - name: "使用当前私有策略生成研究候选池"
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/private-strategy
        run: |
          set -euo pipefail
          if [ -n "${{ inputs.signal_date }}" ]; then
            python scripts/generate_research_candidates.py \
              --private-strategy "$AQUANT_PRIVATE_STRATEGY_PATH" \
              --signal-date "${{ inputs.signal_date }}" \
              --output data/candidates.json
          else
            python scripts/generate_research_candidates.py \
              --private-strategy "$AQUANT_PRIVATE_STRATEGY_PATH" \
              --output data/candidates.json
          fi

      - name: "校验研究候选的策略来源与交易约束"
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/private-strategy
        run: |
          set -euo pipefail
          python scripts/validate_candidates.py

      - name: "生成下一交易日计划"
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/next_trading_day_plan.py

      - name: "校验下一交易日计划"
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/next_trading_day_plan.py --validate

      - name: "更新当前研究版本系统审计"
        env:
          AQUANT_PRIVATE_STRATEGY_PATH: ${{ github.workspace }}/private-strategy
        run: |
          set -euo pipefail
          python scripts/system_audit.py

      - name: "确认候选与系统清单版本完全一致"
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = json.loads(Path("data/candidates.json").read_text(encoding="utf-8"))
          production = json.loads(Path("data/production_status.json").read_text(encoding="utf-8"))
          trial = json.loads(Path("data/research_trial_status.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("config/system_version.json").read_text(encoding="utf-8"))
          assert candidates["status"] == "ready"
          assert candidates["future_function"] is False
          assert candidates["system_version"] == manifest["system_version"]
          assert candidates["strategy_version"] == manifest["strategy_version"] == trial["strategy_version"]
          assert candidates["strategy_commit"] == manifest["strategy_commit"] == trial["strategy_commit"]
          assert candidates["model_definition"]["type"] == "private_short_term_precision_policy"
          assert candidates["candidate_admission_policy"] == manifest["candidate_admission_policy"]
          assert candidates["risk_controls"]["net_win_threshold_pct"] == 1.0
          assert candidates["risk_controls"]["stop_loss_pct"] == 3.0
          assert candidates["holding_window_sessions"] == [2, 5]
          assert production["system_version"] == manifest["system_version"]
          assert production["strategy_version"] == manifest["strategy_version"]
          assert production["production_version"] is None
          assert production["status"] == "research_only"
          assert production["release_gate"] is False
          assert production["strategy_quality_gate_passed"] is False
          assert candidates["production_release"] is False
          print("版本一致性校验通过；当前状态为研究/模拟，正式发布和自动下单均关闭。")
          PY

      - name: "提交候选池与下一交易日计划"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/next_trading_day_plan.json data/candidates_history data/production_status.json data/system_audit.json
          if git diff --cached --quiet; then
            echo "候选产物无变化，无需提交。"
          else
            git commit -m "研究：按当前策略版本更新候选池与模拟计划"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "候选产物推送遇到并发更新，第${attempt}次回基重试。"
              git pull --rebase origin main
            done
            echo "候选产物连续三次推送失败。"
            exit 1
          fi
