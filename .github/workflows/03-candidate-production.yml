name: "03 候选池生产"

on:
  workflow_run:
    workflows: ["02 数据维护"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  push:
    paths:
      - data/manual_candidate_refresh.json

permissions:
  contents: write

concurrency:
  group: "候选生产-main"
  cancel-in-progress: false

jobs:
  gate:
    name: "交易日门禁"
    runs-on: ubuntu-24.04
    outputs:
      is_trading_day: ${{ steps.check.outputs.is_trading_day }}
    steps:
      - name: "检出代码"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - name: "读取交易日状态"
        id: check
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "push" ]; then
            echo "手动刷新请求：使用最近一个已完成交易日数据生成候选池。"
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          test -f data/trading_day_status.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          p = json.loads(Path("data/trading_day_status.json").read_text(encoding="utf-8"))
          print(f"is_trading_day={str(bool(p.get('is_trading_day'))).lower()}")
          PY

  produce:
    name: "按正式基准生成候选池与下一交易日计划"
    needs: gate
    if: ${{ needs.gate.outputs.is_trading_day == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "检出固定Private策略用于审计"
        uses: actions/checkout@v7
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          path: private-strategy
          token: ${{ secrets.AQUANT_PRIVATE_TOKEN }}
          fetch-depth: 1

      - name: "验证策略源提交"
        run: |
          set -euo pipefail
          ACTUAL_PRIVATE_COMMIT="$(git -C private-strategy rev-parse HEAD)"
          echo "Private/main 当前提交: $ACTUAL_PRIVATE_COMMIT"
          test "$ACTUAL_PRIVATE_COMMIT" = "f2b906ede1ab2ddbec7f581e1c99d5d7caca39dd"

      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装Python依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "归档上一交易日候选池"
        run: |
          if [ -f data/candidates.json ] && grep -q '"status": "ready"' data/candidates.json; then
            python scripts/archive_candidates.py
          else
            echo "当前候选快照不是可归档的 ready 状态，跳过归档。"
          fi

      - name: "验证第一版固定模型资产"
        run: |
          set -euo pipefail
          test -f data/models/production_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("config/production_release_v1.json").read_text(encoding="utf-8"))
          model = json.loads(Path("data/models/production_v1.json").read_text(encoding="utf-8"))
          baseline = release["model_baseline"]
          assert model["status"] == "active_baseline"
          assert model["strategy_version"] == baseline["version"]
          assert model["model_code_commit"] == baseline["model_code_commit"]
          assert model["training_start"] == baseline["training_start"]
          assert model["training_end"] == baseline["training_end"]
          print("固定模型资产校验通过；本次运行禁止重新训练。")
          PY

      - name: "使用固定模型生成候选池"
        run: |
          python scripts/generate_research_candidates.py             --threshold 0.60             --model data/models/production_v1.json             --output data/candidates.json

      - name: "生成下一交易日计划"
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/next_trading_day_plan.py

      - name: "校验下一交易日计划"
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/next_trading_day_plan.py --validate

      - name: "校验第一版正式基准快照"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = json.loads(Path("data/candidates.json").read_text(encoding="utf-8"))
          production = json.loads(Path("data/production_status.json").read_text(encoding="utf-8"))
          trial = json.loads(Path("data/research_trial_status.json").read_text(encoding="utf-8"))
          assert candidates["status"] == "ready"
          assert candidates["future_function"] is False
          assert candidates["strategy_version"] == trial["strategy_version"]
          assert candidates["strategy_commit"] == trial["model_code_commit"]
          assert candidates["model_definition"]["probability_threshold"] == 0.60
          assert candidates["candidate_admission_policy"] == "top_2_by_recent_window_model_probability_threshold_0.60"
          assert candidates["risk_controls"]["net_win_threshold_pct"] == 1.0
          assert candidates["risk_controls"]["stop_loss_pct"] == 3.0
          assert candidates["holding_window_sessions"] == [2, 5]
          assert production["production_version"] == "1.0.0"
          assert production["status"] == "released"
          assert production["release_gate"] is True
          assert production["system_audit"] is True
          assert production["strategy_quality_gate_passed"] is False
          print("第一版正式基准硬规则校验通过。")
          PY

      - name: "提交候选池与下一交易日计划"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/next_trading_day_plan.json data/candidates_history
          if git diff --cached --quiet; then
            echo "候选产物无变化，无需提交。"
          else
            git commit -m "生产：按第一版正式基准更新候选池与下一交易日计划"
            git push
          fi
