name: "03 候选池生产"

on:
  push:
    branches: [main]
    paths:
      - "scripts/production_model.py"
      - "scripts/generate_research_candidates.py"
      - "scripts/next_trading_day_plan.py"
      - "config/production_release_v1.json"
      - "data/models/production_v1.json"
  workflow_run:
    workflows: ["02 数据维护"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      signal_date:
        description: "可选：指定本次候选信号日期（北京时间18:00截面）"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: "候选生产-main"
  cancel-in-progress: false

jobs:
  gate:
    name: "交易日与快照日期门禁"
    runs-on: ubuntu-24.04
    outputs:
      is_trading_day: ${{ steps.check.outputs.is_trading_day }}
    steps:
      - name: "检出代码"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "验证上游状态与候选日期"
        id: check
        env:
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ] || [ "$EVENT_NAME" = "push" ]; then
            echo "手动运行或生产代码/模型变更：使用最近可用的已完成交易日数据。"
            echo "is_trading_day=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ "$UPSTREAM_CONCLUSION" != "success" ]; then
            echo "上游数据维护未成功，禁止生成正式候选快照。" >&2
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          tz = ZoneInfo("Asia/Shanghai")
          now = datetime.now(tz)
          status_path = Path("data/trading_day_status.json")
          candidates_path = Path("data/candidates.json")
          if not status_path.exists():
              raise SystemExit("缺少交易日状态文件，禁止使用旧状态生成候选。")
          status = json.loads(status_path.read_text(encoding="utf-8"))
          checked_at = datetime.fromisoformat(status["checked_at"])
          if checked_at.tzinfo is None:
              raise SystemExit("交易日状态时间缺少时区，禁止生成候选。")
          checked_date = checked_at.astimezone(tz).date()

          reason = ""
          eligible = False
          if checked_date != now.date():
              reason = f"交易日状态不是今日检查结果（状态日期={checked_date}，当前日期={now.date()}），等待下一次补跑。"
          elif not bool(status.get("is_trading_day")):
              reason = "上游状态明确标记为非交易日，本次不生成新候选。"
          else:
              candidates = json.loads(candidates_path.read_text(encoding="utf-8")) if candidates_path.exists() else {}
              as_of = str(candidates.get("as_of", ""))
              candidate_date = as_of[:10]
              today = now.date().isoformat()
              if candidate_date >= today:
                  reason = f"正式候选快照已覆盖今日（候选日期={candidate_date}），跳过重复生产。"
              else:
                  eligible = True
                  reason = f"今日为交易日，当前正式候选日期={candidate_date}，允许生成最新候选。"

          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"is_trading_day={str(eligible).lower()}\n")
          print(reason)
          PY

  produce:
    name: "按正式基准生成候选池与下一交易日计划"
    needs: gate
    if: ${{ needs.gate.outputs.is_trading_day == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: "检出公开仓库"
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: "检出固定Private策略用于审计"
        uses: actions/checkout@v7
        with:
          repository: 13415837267/Aquant-Private
          ref: main
          path: private-strategy
          token: ${{ secrets.AQUANT_PRIVATE_TOKEN }}
          fetch-depth: 1

      - name: "验证策略源提交"
        run: |
          set -euo pipefail
          ACTUAL_PRIVATE_COMMIT="$(git -C private-strategy rev-parse HEAD)"
          echo "Private/main 当前提交: $ACTUAL_PRIVATE_COMMIT"
          test "$ACTUAL_PRIVATE_COMMIT" = "bd395f5577b4247ac621293dfb3a248a7b1d1e00"

      - name: "设置Python"
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip

      - name: "安装Python依赖"
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: "归档上一交易日候选池"
        run: |
          if [ -f data/candidates.json ] && grep -q '"status": "ready"' data/candidates.json; then
            python scripts/archive_candidates.py
          else
            echo "当前候选快照不是可归档的 ready 状态，跳过归档。"
          fi

      - name: "验证第一版固定模型资产"
        run: |
          set -euo pipefail
          test -f data/models/production_v1.json
          python - <<'PY'
          import json
          from pathlib import Path
          release = json.loads(Path("config/production_release_v1.json").read_text(encoding="utf-8"))
          model = json.loads(Path("data/models/production_v1.json").read_text(encoding="utf-8"))
          baseline = release["model_baseline"]
          assert model["status"] == "active_baseline"
          assert model["strategy_version"] == baseline["version"]
          assert model["model_code_commit"] == baseline["model_code_commit"]
          assert model["training_start"] == baseline["training_start"]
          assert model["training_end"] == baseline["training_end"]
          print("固定模型资产校验通过；本次运行禁止重新训练。")
          PY

      - name: "使用固定模型生成候选池"
        run: |
          if [ -n "${{ inputs.signal_date }}" ]; then
            python scripts/generate_research_candidates.py \
              --threshold 0.60 \
              --model data/models/production_v1.json \
              --signal-date "${{ inputs.signal_date }}" \
              --output data/candidates.json
          else
            python scripts/generate_research_candidates.py \
              --threshold 0.60 \
              --model data/models/production_v1.json \
              --output data/candidates.json
          fi

      - name: "生成下一交易日计划"
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/next_trading_day_plan.py

      - name: "校验下一交易日计划"
        env:
          ZZSHARE_TOKEN: ${{ secrets.ZZSHARE_TOKEN }}
        run: python scripts/next_trading_day_plan.py --validate

      - name: "校验第一版正式基准快照"
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          candidates = json.loads(Path("data/candidates.json").read_text(encoding="utf-8"))
          production = json.loads(Path("data/production_status.json").read_text(encoding="utf-8"))
          trial = json.loads(Path("data/research_trial_status.json").read_text(encoding="utf-8"))
          assert candidates["status"] == "ready"
          assert candidates["future_function"] is False
          assert candidates["strategy_version"] == trial["strategy_version"]
          assert candidates["strategy_commit"] == trial["model_code_commit"]
          assert candidates["model_definition"]["probability_threshold"] == 0.60
          assert candidates["candidate_admission_policy"] == "top_2_by_recent_window_model_probability_threshold_0.60"
          assert candidates["risk_controls"]["net_win_threshold_pct"] == 1.0
          assert candidates["risk_controls"]["stop_loss_pct"] == 3.0
          assert candidates["holding_window_sessions"] == [2, 5]
          assert production["production_version"] == "1.0.0"
          assert production["status"] == "released"
          assert production["release_gate"] is True
          assert production["system_audit"] is True
          assert production["strategy_quality_gate_passed"] is False
          print("第一版正式基准硬规则校验通过。")
          PY

      - name: "提交候选池与下一交易日计划"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/candidates.json data/next_trading_day_plan.json data/candidates_history
          if git diff --cached --quiet; then
            echo "候选产物无变化，无需提交。"
          else
            git commit -m "生产：按第一版正式基准更新候选池与下一交易日计划"
            for attempt in 1 2 3; do
              if git push; then
                exit 0
              fi
              echo "候选产物推送遇到并发更新，第${attempt}次回基重试。"
              git pull --rebase origin main
            done
            echo "候选产物连续三次推送失败。"
            exit 1
          fi
